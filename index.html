        '</div>';
}

function weekPlayers(week) {
    const set = new Set();
    (week.players ? week.players.team1.concat(week.players.team2) : []).forEach(p => set.add(p));
    week.games.forEach(g => { g.team1.concat(g.team2).forEach(p => set.add(p)); });
    return Array.from(set);
}

/* ---------- Position chart (bump chart of rank over weeks) ---------- */
function toggleChartHighlight(name) {
    state.lbHighlight = state.lbHighlight === name ? null : name;
    renderSeasonTab();
}
// Standing after each week: cumulative points so far, ranked 1..k among the
// players who have appeared by then.
function rankByWeek(season, names) {
    const cum = {}; names.forEach(n => { cum[n] = 0; });
    const seen = {};
    return season.map(w => {
        weekPlayers(w).forEach(p => { if (cum[p] !== undefined) seen[p] = true; });
        if (w.finalTally) Object.entries(w.finalTally).forEach(([p, v]) => { if (cum[p] !== undefined) cum[p] += Number(v) || 0; });
        const active = names.filter(n => seen[n]).sort((a, b) => (cum[b] - cum[a]) || a.localeCompare(b));
        const ranks = {}; active.forEach((n, i) => { ranks[n] = i + 1; });
        return { ranks: ranks, points: Object.assign({}, cum) };
    });
}
// Catmull-Rom spline through every rank node, emitted as cubic beziers so the
// line stays smooth but still passes exactly through each week's rank.
function smoothPath(p, clampLo, clampHi) {
    if (p.length === 1) return '';
    if (p.length === 2) return 'M' + p[0].x + ' ' + p[0].y + ' L' + p[1].x + ' ' + p[1].y;
    const t = 0.82, r1 = v => Math.round(v * 10) / 10;
    const cy = v => Math.max(clampLo, Math.min(clampHi, v));
    let d = 'M' + p[0].x + ' ' + p[0].y;
    for (let i = 0; i < p.length - 1; i++) {
        const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
        const c1x = p1.x + (p2.x - p0.x) / 6 * t, c1y = cy(p1.y + (p2.y - p0.y) / 6 * t);
        const c2x = p2.x - (p3.x - p1.x) / 6 * t, c2y = cy(p2.y - (p3.y - p1.y) / 6 * t);
        d += ' C' + r1(c1x) + ' ' + r1(c1y) + ' ' + r1(c2x) + ' ' + r1(c2y) + ' ' + p2.x + ' ' + p2.y;

}
function bumpChartHtml(season, leaderboard) {
    const names = leaderboard.map(p => p.name);

    const plotX0 = leftM - 12, plotX1 = X(season.length - 1) + 12;
    const plotY0 = topM - 15, plotY1 = Y(maxRank) + 15;

    let svg = '<svg class="bump-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Player rank by week">';

// Cumulative badge tallies after each week, and the Net they imply.
function netByWeek(season, names) {
    const k = {}, j = {}, c = {}, seen = {}; names.forEach(n => { k[n] = 0; j[n] = 0; c[n] = 0; });
    return season.map(w => {
        weekPlayers(w).forEach(p => { if (k[p] !== undefined) seen[p] = true; });
        const t1 = (w.players && w.players.team1) || [], t2 = (w.players && w.players.team2) || [];
        (w.koRounds || []).forEach(r => {
            const kings = r.winner === 'team1' ? t1 : t2;
            const losers = r.winner === 'team1' ? t2 : t1;
            kings.forEach(p => { if (k[p] !== undefined) k[p]++; });
            losers.forEach(p => { if (j[p] !== undefined) j[p]++; });
            (r.crossed || []).forEach(p => { if (c[p] !== undefined) c[p]++; });
        });
        const net = {}; names.forEach(n => { net[n] = k[n] - (j[n] - c[n]); });
        return { net: net, k: Object.assign({}, k), j: Object.assign({}, j), c: Object.assign({}, c), seen: Object.assign({}, seen) };
    });
}
function niceIntStep(range, count) {
    const raw = Math.max(range, 1) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    const s = n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10;
    return Math.max(1, Math.round(s * mag));
}
function netChartHtml(season, leaderboard) {
    const names = leaderboard.map(p => p.name);
    if (season.length < 1 || names.length < 2) {
        return '<div class="hint" style="margin-top:8px;">Need at least two players and one recorded week to chart Net.</div>';
    }
    const series = netByWeek(season, names);
    let minV = 0, maxV = 0;
    series.forEach(wk => names.forEach(n => { if (wk.seen[n]) { minV = Math.min(minV, wk.net[n]); maxV = Math.max(maxV, wk.net[n]); } }));
    if (minV === 0 && maxV === 0) {
        return '<div class="hint" style="margin-top:8px;">No King Maker / Joker rounds recorded yet &mdash; the Net trend appears once you log some 12-0 rounds.</div>';
    }
    const PAL = chartPalette();

    const colored = idx => idx < PAL.length;
    const colorFor = idx => colored(idx) ? PAL[idx] : MUTE;
    const hl = state.lbHighlight;

    const step = niceIntStep(Math.max(0, maxV) - Math.min(0, minV), 4);
    let hi = Math.ceil(Math.max(0, maxV) / step) * step, lo = Math.floor(Math.min(0, minV) / step) * step;
    if (hi === lo) { hi += step; lo -= step; }

    const topM = 26, plotH = Math.max(150, Math.min(260, ((hi - lo) / step) * 40)), botM = 40, leftM = 38;
    const maxNameLen = names.reduce((m, n) => Math.max(m, n.length), 0);
    const rightM = Math.min(200, Math.max(96, maxNameLen * 7.0 + 58));
    const xStep = Math.max(64, Math.min(122, season.length > 1 ? 430 / (season.length - 1) : 430));
    const X = wi => leftM + wi * xStep;
    const Y = v => topM + (hi - v) / (hi - lo) * plotH;
    const W = Math.round(leftM + (season.length - 1) * xStep + rightM);
    const H = topM + plotH + botM;
    const plotX0 = leftM - 12, plotX1 = X(season.length - 1) + 12;
    const y0 = Y(0);

    // Plot surface + positive(green)/negative(red) bands around the zero line.

    svg += '<rect x="' + plotX0 + '" y="' + Y(hi) + '" width="' + (plotX1 - plotX0) + '" height="' + Math.max(0, y0 - Y(hi)) + '" fill="' + cssVar('--chart-pos') + '" opacity="0.08"/>';
    svg += '<rect x="' + plotX0 + '" y="' + y0 + '" width="' + (plotX1 - plotX0) + '" height="' + Math.max(0, Y(lo) - y0) + '" fill="' + cssVar('--chart-neg') + '" opacity="0.08"/>';
    // Value gridlines + labels (zero line drawn bold).
    for (let v = lo; v <= hi; v += step) {
        const y = Y(v);
        if (v === 0) svg += '<line x1="' + plotX0 + '" y1="' + y + '" x2="' + plotX1 + '" y2="' + y + '" stroke="var(--muted)" stroke-width="1.4"/>';
        else svg += '<line class="bump-grid" x1="' + plotX0 + '" y1="' + y + '" x2="' + plotX1 + '" y2="' + y + '"/>';

        const md = (w.date || '').slice(5).replace('-', '/');
        if (md) svg += '<text class="bump-date" x="' + x + '" y="' + (H - 7) + '" text-anchor="middle">' + md + '</text>';
    });

    const order = leaderboard.map((p, idx) => ({ p: p, idx: idx })).sort((a, b) => (hl === a.p.name ? 1 : 0) - (hl === b.p.name ? 1 : 0));
    order.forEach(({ p, idx }) => {
        const pts = [];
        series.forEach((wk, wi) => {
            if (wk.seen[p.name]) pts.push({ x: X(wi), y: Y(wk.net[p.name]), v: wk.net[p.name], wi: wi, k: wk.k[p.name], j: wk.j[p.name], c: wk.c[p.name] });

        if (!pts.length) return;
        const col = colorFor(idx);
        const isHl = hl === p.name;

        });

            (isHl ? ' filter="url(#netSh)"' : '') + '/>' +
            '<text class="bump-pill-txt" x="' + (px + pillW / 2) + '" y="' + (last.y + 4) + '" text-anchor="middle">' + esc(tag) + '</text></g>';

    svg += '</svg>';

    return '<div class="chart-wrap">' + svg + '</div>';

    const place = p => byPoints.indexOf(p) + 1;
    const crowns = { 1: icon('crown'), 2: icon('medal'), 3: icon('medal') };
    const cells = order.map(p => {

function renderSeasonTab() {
    const season = state.data.season;
    let html = pastFormHtml();

    if (season.length === 0) {
        html += '<div class="card"><div class="empty"><div class="big">' + icon('trophy') + '</div>' +
            '<strong style="display:block;color:var(--text);font-size:15px;">No game days yet</strong></div></div>';
    } else {
        // Per-player aggregates
        const stats = {};
        function stat(p) {
            if (!stats[p]) stats[p] = { points: 0, roundWins: 0, weeks: 0, tallied: false, kings: 0, jokers: 0, crossed: 0 };
            return stats[p];
        }
        season.forEach(w => {
            const t1 = (w.players && w.players.team1) || [];
            const t2 = (w.players && w.players.team2) || [];
            const ko = w.koRounds || [];
            weekPlayers(w).forEach(p => stat(p).weeks++);
            // Round wins: for a manually-entered week the recorded 12-0 rounds are
            // its rounds (each is a win for its team); otherwise use the round log.
            if (w.manual && ko.length) {
                ko.forEach(r => (r.winner === 'team1' ? t1 : t2).forEach(p => stat(p).roundWins++));
            } else {
                (w.rounds || []).forEach(r => r.winnerPlayers.forEach(p => stat(p).roundWins++));
            }
            if (w.finalTally) Object.entries(w.finalTally).forEach(([p, v]) => { stat(p).points += v; stat(p).tallied = true; });
            // King Maker / Joker badges from 12-0 rounds.
            ko.forEach(r => {
                const kings = r.winner === 'team1' ? t1 : t2;
                const losers = r.winner === 'team1' ? t2 : t1;
                kings.forEach(p => { stat(p).kings++; });
                losers.forEach(p => { stat(p).jokers++; });
                (r.crossed || []).forEach(p => { stat(p).crossed++; });
            });
        });

        const ppgw = p => p.weeks ? p.points / p.weeks : 0;
        // Net = King Maker - (Jokers received - Jokers lifted).
        const netOf = p => (p.kings || 0) - ((p.jokers || 0) - (p.crossed || 0));
        // Sortable leaderboard columns. Every column falls back to the default
        // tie-break chain: Points -> King Maker -> PPGW, then name.
        const lbVal = {
            points: p => p.points,
            kings: p => p.kings || 0,
            jokers: p => p.jokers || 0,
            crossed: p => p.crossed || 0,
            net: p => netOf(p),
            ppgw: p => p.ppgw
        };
        const sortBy = lbVal[state.lbSort] ? state.lbSort : 'points';
        const tieChain = ['points', 'kings', 'ppgw'];
        const sortKeys = [sortBy, ...tieChain.filter(k => k !== sortBy)];
        const leaderboard = Object.entries(stats)
            .map(([name, s]) => ({ name, ...s, ppgw: (s.weeks ? s.points / s.weeks : 0) }))
            .sort((a, b) => {
                for (const k of sortKeys) { const d = lbVal[k](b) - lbVal[k](a); if (d) return d; }
                return a.name.localeCompare(b.name);
            });

        if (leaderboard.length) {
            // The podium always ranks by points, whatever column the table is sorted on.
            const byPoints = leaderboard.slice().sort((a, b) =>
                (b.points - a.points) || ((b.kings || 0) - (a.kings || 0)) || (b.ppgw - a.ppgw) || a.name.localeCompare(b.name));
            html += podiumHtml(byPoints);

            const view = ['weekly', 'chart', 'net'].includes(state.lbView) ? state.lbView : 'ranking';
            // Clickable, sortable header cell. Active column shows a caret.
            const caret = ' ' + icon('caret', 'sort-caret');
            const th = (label, key, title) => '<th class="sortable ' + (sortBy === key ? 'sorted' : '') + '"' +
                (title ? ' title="' + title + '"' : '') + ' onclick="setLbSort(\'' + key + '\')">' +
                label + (sortBy === key ? caret : '') + '</th>';

            // Ranking table
            const rankingHtml =
                '<div class="lb-table-wrap"><table class="lb-table"><thead><tr>' +
                '<th class="col-name">Player</th>' +
                th(iconKing('i-sm'), 'kings', 'King Maker') +
                th(iconJoker('i-sm'), 'jokers', 'Jokers received') +
                th(iconCrossed(true), 'crossed', 'Jokers lifted') +
                th('Net', 'net', 'King Maker − (Jokers − lifted)') +
                th('PPGW', 'ppgw') + th('Pts', 'points') +
                '</tr></thead><tbody>' +
                leaderboard.map((p, i) =>
                    '<tr>' +
                    '<td class="col-name"><div class="name-cell">' +
                    '<span class="lb-rank ' + (i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '') + '">' + (i + 1) + '</span>' +
                    avatarHtml(p.name, 'sm') +
                    '<span class="nm"><span class="nt"><span>' + esc(p.name) + '</span>' + guestTag(p.name) + '</span>' +
                    '<span class="lb-sub">' + p.roundWins + ' wins \u00b7 ' + p.weeks + ' wks</span></span>' +
                    '</div></td>' +
                    '<td class="' + (sortBy === 'kings' ? 'sorted' : '') + '">' + (p.kings || 0) + '</td>' +
                    '<td class="' + (sortBy === 'jokers' ? 'sorted' : '') + '">' + (p.jokers || 0) + '</td>' +
                    '<td class="' + (sortBy === 'crossed' ? 'sorted' : '') + '">' + (p.crossed || 0) + '</td>' +
                    '<td class="' + (sortBy === 'net' ? 'sorted' : '') + '" style="color:' + (netOf(p) >= 0 ? 'var(--green)' : 'var(--red)') + '">' + netOf(p) + '</td>' +
                    '<td class="' + (sortBy === 'ppgw' ? 'sorted' : '') + '">' + p.ppgw.toFixed(1) + '</td>' +
                    '<td class="lb-pts-cell ' + (sortBy === 'points' ? 'sorted' : '') + '" style="color:' + (p.points >= 0 ? 'var(--green)' : 'var(--red)') + '">' + round2(p.points) + '</td>' +
                    '</tr>').join('') +
                '</tbody></table></div>' +
                '';

            // Weekly breakdown: "points won" (badges add no points).
            const cellFor = (w, p) => {
                if (!weekPlayers(w).includes(p)) return null;
                const base = (w.finalTally && w.finalTally[p] !== undefined) ? w.finalTally[p] : 0;
                return { base };
            };
            const weeklyHtml =
                '<div class="lb-table-wrap"><table class="lb-table wk-table"><thead><tr>' +
                '<th class="col-name">Player</th>' +
                season.map(w => '<th title="' + esc(w.date) + (w.manual ? ' (manual)' : '') + '">W' + w.week + '</th>').join('') +
                '<th>Total</th></tr></thead><tbody>' +
                leaderboard.map(pl => {
                    let total = 0;
                    const cells = season.map(w => {
                        const c = cellFor(w, pl.name);
                        if (!c) return '<td class="wk-empty">\u2013</td>';
                        total += c.base;
                        const col = c.base > 0 ? 'var(--green)' : c.base < 0 ? 'var(--red)' : 'var(--muted)';
                        return '<td style="color:' + col + ';font-weight:700">' + round2(c.base) + '</td>';
                    }).join('');
                    return '<tr><td class="col-name"><div class="name-cell">' + avatarHtml(pl.name, 'sm') +
                        '<span class="nm"><span class="nt"><span>' + esc(pl.name) + '</span>' + guestTag(pl.name) + '</span></span></div></td>' +
                        cells + '<td class="lb-pts-cell" style="color:' + (total >= 0 ? 'var(--green)' : 'var(--red)') + '">' + round2(total) + '</td></tr>';
                }).join('') +
                '</tbody></table></div>' +
                '';

            html += '<div class="card"><h3>' + icon('trophy') + 'Player leaderboard</h3>' +
                '<div class="lb-view">' +
                '<button class="' + (view === 'ranking' ? 'on' : '') + '" onclick="setLbView(\'ranking\')">Ranking</button>' +
                '<button class="' + (view === 'weekly' ? 'on' : '') + '" onclick="setLbView(\'weekly\')">Weekly breakdown</button>' +
                '<button class="' + (view === 'chart' ? 'on' : '') + '" onclick="setLbView(\'chart\')">' + icon('lineChart') + 'Position chart</button>' +
                '<button class="' + (view === 'net' ? 'on' : '') + '" onclick="setLbView(\'net\')">' + icon('barChart') + 'Net trend</button>' +
                '</div>' +
                (view === 'ranking' ? rankingHtml : view === 'weekly' ? weeklyHtml :
                    view === 'chart' ? bumpChartHtml(season, leaderboard) : netChartHtml(season, leaderboard)) +
                '</div>';
        }

        const koTotal = season.reduce((n, w) => n + ((w.koRounds || []).length), 0);
        const roundsTotal = leaderboard.reduce((n, p) => n + p.roundWins, 0);
        const lastDate = season.length ? season[season.length - 1].date : '';
        const tile = (v, l, cls, ic) => '<div class="stat-tile ' + cls + '"><div class="sv">' + (ic ? icon(ic) : '') + '<span>' + v + '</span></div><div class="sl">' + l + '</div></div>';
        html += '<div class="card"><h3>' + icon('barChart') + 'Season stats</h3>' +
            '<div class="stat-grid">' +
            tile(season.length, 'Game days', 'blue', 'calendar') +
            tile(leaderboard.length, 'Players', 'green', 'users') +
            tile(roundsTotal, 'Round wins', 'amber', 'trophy') +
            tile(koTotal, '12-0 rounds', 'violet', 'crown') +
            '</div>' +
            (lastDate ? '<div class="hint" style="text-align:center;">Last game day &middot; ' + esc(lastDate) + '</div>' : '') +
            '</div>';

        for (let i = season.length - 1; i >= 0; i--) {
            const w = season[i];
            const rounds = w.rounds || [];
            const t1r = rounds.filter(r => r.winner === 'team1').length;
            const t2r = rounds.filter(r => r.winner === 'team2').length;
            const players = w.players || { team1: [], team2: [] };
            const t1names = playerChips(players.team1);
            const t2names = playerChips(players.team2);
            const s1 = w.manual ? w.teamScores.team1 : t1r;
            const s2 = w.manual ? w.teamScores.team2 : t2r;
            const caption = w.manual ? 'Final score' : 'Rounds won';
            const footer = w.manual
                ? 'Entered manually' + (w.finalTally ? ' \u00b7 points recorded ' + icon('check','i-xs') + '' : '')
                : w.games.length + ' games' + (w.finalTally ? ' \u00b7 tally saved ' + icon('check','i-xs') + '' : ' \u00b7 tally pending');

            const ko = w.koRounds || [];
            let koLine = '';
            if (ko.length) {
                const lines = ko.map((r, ri) => {
                    const kingTeam = r.winner === 'team1' ? 'Team 1' : 'Team 2';
                    const kingCls = r.winner === 'team1' ? 'ko-t1' : 'ko-t2';
                    const lifted = (r.crossed || []).length
                        ? '<span class="ko-lift">' + iconCrossed(true) + ' ' + r.crossed.map(esc).join(', ') + '</span>'
                        : '';
                    return '<div class="ko-line"><span class="ko-rn">Round ' + (ri + 1) + '</span>' +
                        iconKing('i-sm') +
                        '<span class="' + kingCls + '">' + kingTeam + '</span>' + lifted + '</div>';
                }).join('');
                koLine = '<div class="ko-summary"><div class="ko-summary-title">' + ko.length + '× 12-0 rounds</div>' + lines + '</div>';
            }

            const editing = state.editWeek === i;
            html += '<div class="card">' +
                '<div class="week-head">' +
                '<span class="wk-no"><span class="wk-chip">W' + w.week + '</span>' +
                '<span class="wk-date">' + esc(w.date) + '</span>' +
                (w.manual ? '<span class="badge manual">manual</span>' : '') + '</span>' +
                '<span class="wk-right">' +
                (editing ? '' : '<button class="btn small subtle" onclick="editWeekOpen(' + i + ')">' + icon('pencil') + 'Edit points</button>') +
                '</span></div>' +
                '<div class="matchup">' +
                '<div class="team t1' + (s1 > s2 ? ' win' : '') + '"><div class="tlabel">Team 1</div>' +
                '<div class="tscore" style="color:var(--blue)">' + s1 + '</div>' +
                '<div class="tplayers">' + t1names + '</div></div>' +
                '<div class="vs">vs</div>' +
                '<div class="team t2' + (s2 > s1 ? ' win' : '') + '"><div class="tlabel">Team 2</div>' +
                '<div class="tscore" style="color:var(--red)">' + s2 + '</div>' +
                '<div class="tplayers">' + t2names + '</div></div>' +
                '</div>' +
                '<div class="score-caption">' + caption + '</div>' +
                '<div class="meta" style="text-align:center;margin-top:8px;">' + footer + '</div>' +
                koLine +
                (editing ? weekEditHtml(w) : '') +
                '</div>';
        }
    }
    document.getElementById('tab-season').innerHTML = html;
}

function weekEditHtml(w) {
    const isManual = w.manual;
    const teamScoreRow = isManual
        ? '<div class="row">' +
          '<div><label>Team 1 score</label><input type="number" step="any" value="' + esc(state.editBuf.score1) + '" oninput="setEditScore(1, this.value)"></div>' +
          '<div><label>Team 2 score</label><input type="number" step="any" value="' + esc(state.editBuf.score2) + '" oninput="setEditScore(2, this.value)"></div>' +
          '</div>' +
          ''
        : '';
    const rows = weekPlayers(w).map(p => {
        const arg = jsArg(p);
        const ph = isManual ? 'team' : '0';
        return '<div class="tally-row">' + avatarHtml(p, 'sm') + '<span class="tname">' + esc(p) + '</span>' +
            '<input type="number" step="any" placeholder="' + ph + '" value="' + esc(state.editBuf.points[p] || '') + '" oninput="setEditPoints(' + arg + ', this.value)"></div>';
    }).join('');
    return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);">' +
        '<label>Edit points for Week ' + w.week + '</label>' +
        teamScoreRow + rows +
        koEditorHtml('edit', w.players.team1 || [], w.players.team2 || []) +
        '<div class="row" style="margin-top:10px;">' +
        '<button class="btn subtle" onclick="editWeekCancel()">Cancel</button>' +
        '<button class="btn blue" onclick="editWeekSave()">Save changes</button>' +
        '</div></div>';
}

function renderDataTab() {
    const weeks = (state.data.season || []).length;
    const players = (state.data.roster || []).length;
    const bytes = JSON.stringify(state.data).length;
    const size = bytes > 1024 ? (bytes / 1024).toFixed(1) + ' KB' : bytes + ' B';
    const tile = (v, l, cls, ic) => '<div class="stat-tile ' + cls + '"><div class="sv">' + (ic ? icon(ic) : '') + '<span>' + v + '</span></div><div class="sl">' + l + '</div></div>';

    document.getElementById('tab-data').innerHTML =
        '<div class="card"><h3>' + icon('database') + 'Stored data</h3>' +
        '<div class="stat-grid">' +
        tile(weeks, 'Game days', 'blue', 'calendar') +
        tile(players, 'Roster', 'green', 'users') +
        tile(size, 'Size', 'amber', 'database') +
        tile(getToken() ? 'Yes' : 'No', 'Signed in', 'violet', 'check') +
        '</div></div>' +
        '<div class="card"><h3>' + icon('download') + 'Backup and restore</h3>' +
        '<div class="row">' +
        '<button class="btn green" onclick="exportData()">' + icon('download') + 'Export JSON</button>' +
        '<button class="btn blue" onclick="document.getElementById(\'import-file\').click()">' + icon('upload') + 'Import JSON</button>' +
        '</div>' +
        '<input id="import-file" type="file" accept=".json" onchange="importData(event)" style="display:none;">' +
        '</div>' +
        '<div class="card"><h3>' + icon('copy') + 'Raw data</h3>' +
        '<textarea readonly>' + esc(JSON.stringify(state.data, null, 2)) + '</textarea>' +
        '<button class="btn subtle" style="margin-top:10px;" onclick="copyJson()">' + icon('copy') + 'Copy to clipboard</button></div>' +
        '<div class="card"><h3>' + icon('logOut') + 'Account</h3>' +
        '<button class="btn danger" onclick="logout()">' + icon('logOut') + 'Sign out</button></div>';
}

function render() {
    if (state.activeTab === 'season') renderSeasonTab();
    if (state.activeTab === 'teams') renderTeamsTab();
    if (state.activeTab === 'roster') renderRosterTab();
    if (state.activeTab === 'data') renderDataTab();
}

applyTheme();
localLoad();
render();
serverLoad();
</script>
</body>
</html>
