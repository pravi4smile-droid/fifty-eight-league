<style>
/* ============================================================
   Fifty Six League — Liquid Glass theme
   Translucent layered surfaces over a soft colour field, with
   specular top edges and an angular sheen on every panel.
   ============================================================ */
:root {
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --num: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;

    --r-2xl: 28px; --r-xl: 24px; --r-lg: 20px; --r: 15px; --r-sm: 11px;

:root[data-theme="light"] {

    --glass: rgba(255,255,255,.60);

    --edge: rgba(255,255,255,.85);
    --hair: rgba(13,21,38,.09);
    --spec: rgba(255,255,255,.92);
    --sheen: rgba(255,255,255,.34);
    --field: rgba(255,255,255,.55);
    --field-on: rgba(255,255,255,.92);

    --primary: #21518f; --strong: #2b62ab; --strong-2: #4a90e2; --strong-fg: #fff;
    --blue: #2f6fdb; --red: #e0405f; --green: #17a05c; --accent: #dd8412;
    --violet: #7043d6; --gold: #d9a012;
    --tint-blue: rgba(47,111,219,.13); --tint-red: rgba(224,64,95,.13);
    --tint-green: rgba(23,160,92,.14); --tint-amber: rgba(221,132,18,.15);
    --tint-violet: rgba(112,67,214,.13); --tint-neutral: rgba(13,21,38,.055);
    --on-blue: #1d4ed8; --on-red: #c02c49; --on-green: #10794a;
    --on-amber: #a45f0a; --on-violet: #5b32b8;
    --sorted-bg: rgba(47,111,219,.08);

    /* Text/icons that sit on a saturated fill, and the gloss highlight on it. */
    --on-accent: #ffffff;
    --gloss: rgba(255,255,255,.34);
    --gloss-strong: rgba(255,255,255,.55);
    --lighten: #ffffff;   /* the pole colour gradients mix toward */

    /* Header (always a saturated gradient, so its glass is white-tinted). */
    --hdr-1: #1d3f75; --hdr-2: #2f6bb5; --hdr-3: #57a0e0; --hdr-fg: #ffffff;
    --hdr-glass: rgba(255,255,255,.16); --hdr-glass-2: rgba(255,255,255,.38);
    --hdr-edge: rgba(255,255,255,.28); --hdr-spec: rgba(255,255,255,.45);
    --hdr-sheen: rgba(255,255,255,.26);

    /* Medals: podium plinths, rank pills and chart discs all read from these. */
    --medal-1a: #ffe89a; --medal-1b: #d99f0d; --medal-1ink: #5f4204; --medal-1flat: #e8b60d;
    --medal-2a: #f0f3f8; --medal-2b: #b3bdca; --medal-2ink: #414b58; --medal-2flat: #c2cbd8;
    --medal-3a: #f6cda3; --medal-3b: #c9884f; --medal-3ink: #5b330d; --medal-3flat: #cd8f56;
    --medal-ring: rgba(255,255,255,.65);

    /* Cast shadows, split out so dark mode can go deeper. */
    --sh-cast: rgba(13,21,38,.20);
    --sh-cast-soft: rgba(13,21,38,.14);
    --sh-col: rgba(13,21,38,.30);
    --sh-inset: rgba(13,21,38,.05);
    --sh-sm: 0 1px 2px rgba(13,21,38,.05), 0 4px 14px rgba(13,21,38,.06);
    --sh-md: 0 8px 28px rgba(13,21,38,.10), 0 2px 8px rgba(13,21,38,.05);
    --sh-lg: 0 20px 52px rgba(13,21,38,.18), 0 4px 12px rgba(13,21,38,.08);
    --scrim: rgba(13,21,38,.4);

    /* Chart surfaces + the categorical series palette read by the SVG builders. */
    --chart-plot: rgba(255,255,255,.5); --chart-stripe: #0d1526; --chart-stripe-op: .04;
    --chart-dot-ring: #ffffff; --chart-shadow: #0b1220;
    --chart-pos: #17a05c; --chart-neg: #e0405f;
    --c-mute: #c2c6cc; --c-pill-mute: #6b7280; --chart-pill-ink: #ffffff;
    --c1: #2a78d6; --c2: #1baf7a; --c3: #eda100; --c4: #008300;
    --c5: #4a3aa7; --c6: #e34948; --c7: #e87ba4; --c8: #eb6834;

    /* Avatar gradient stops (hue comes from the player's name). */
    --avi-s1: 62%; --avi-l1: 56%; --avi-s2: 60%; --avi-l2: 44%;
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #070b16;
    --blob-1: #23508f; --blob-2: #4b2f86; --blob-3: #16564c;
    --text: #eaeffa; --text-2: #c3cde0; --muted: #8d9ab4;

    --glass: rgba(30,38,60,.56);
    --glass-2: rgba(30,38,60,.38);
    --glass-solid: #151c2f;
    --edge: rgba(255,255,255,.13);
    --hair: rgba(255,255,255,.09);
    --spec: rgba(255,255,255,.22);
    --sheen: rgba(255,255,255,.07);
    --field: rgba(255,255,255,.06);
    --field-on: rgba(255,255,255,.11);

    --primary: #8fbcff; --strong: #2d63aa; --strong-2: #4d95e8; --strong-fg: #fff;
    --blue: #5fa2fb; --red: #fb6f8c; --green: #43d68a; --accent: #f5ae30;
    --violet: #a98cfa; --gold: #f5c542;
    --tint-blue: rgba(95,162,251,.17); --tint-red: rgba(251,111,140,.16);
    --tint-green: rgba(67,214,138,.15); --tint-amber: rgba(245,174,48,.16);
    --tint-violet: rgba(169,140,250,.16); --tint-neutral: rgba(255,255,255,.07);
    --on-blue: #9cc6ff; --on-red: #ffa2b3; --on-green: #85e9b4;
    --on-amber: #ffcd6f; --on-violet: #c9b2ff;
    --sorted-bg: rgba(95,162,251,.11);

    --on-accent: #ffffff;
    --gloss: rgba(255,255,255,.20);
    --gloss-strong: rgba(255,255,255,.28);
    --lighten: #ffffff;

    --hdr-1: #14264a; --hdr-2: #1f4a86; --hdr-3: #2e6cb0; --hdr-fg: #ffffff;
    --hdr-glass: rgba(255,255,255,.12); --hdr-glass-2: rgba(255,255,255,.26);
    --hdr-edge: rgba(255,255,255,.20); --hdr-spec: rgba(255,255,255,.30);
    --hdr-sheen: rgba(255,255,255,.16);

    --medal-1a: #f5d572; --medal-1b: #b8830a; --medal-1ink: #3a2802; --medal-1flat: #e0ae1c;
    --medal-2a: #d5dce7; --medal-2b: #8d97a6; --medal-2ink: #23292f; --medal-2flat: #b6c0cd;
    --medal-3a: #e2b184; --medal-3b: #a56c3a; --medal-3ink: #331904; --medal-3flat: #c08150;
    --medal-ring: rgba(255,255,255,.45);

    --sh-cast: rgba(0,0,0,.5);
    --sh-cast-soft: rgba(0,0,0,.4);
    --sh-col: rgba(0,0,0,.6);
    --sh-inset: rgba(0,0,0,.25);
    --sh-sm: 0 1px 2px rgba(0,0,0,.45);
    --sh-md: 0 10px 30px rgba(0,0,0,.5);
    --sh-lg: 0 22px 56px rgba(0,0,0,.62);
    --scrim: rgba(0,0,0,.6);

    --chart-plot: rgba(255,255,255,.045); --chart-stripe: #ffffff; --chart-stripe-op: .05;
    --chart-dot-ring: #151c2f; --chart-shadow: #000000;
    --chart-pos: #43d68a; --chart-neg: #fb6f8c;
    --c-mute: #5c6780; --c-pill-mute: #9aa5bd; --chart-pill-ink: #0b1020;
    --c1: #5fa2fb; --c2: #3ed99b; --c3: #f5c542; --c4: #4cc76a;
    --c5: #9b8cf5; --c6: #fb7185; --c7: #f79ac4; --c8: #fb9a5f;

    --avi-s1: 58%; --avi-l1: 52%; --avi-s2: 56%; --avi-l2: 38%;
}

/* ============================================================
   Base + the colour field the glass refracts
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
    font-family: var(--font);
    background: var(--bg);
    margin: 0; color: var(--text);
    font-size: 15px; line-height: 1.45;
    padding-bottom: calc(104px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
    position: relative;
}
/* Soft colour blooms sit behind everything so the glass has something to pick up. */
body::before {
    content: ''; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background:
        radial-gradient(38vmax 30vmax at 12% -4%, var(--blob-1), transparent 62%),
        radial-gradient(34vmax 28vmax at 96% 12%, var(--blob-2), transparent 60%),
        radial-gradient(40vmax 32vmax at 46% 104%, var(--blob-3), transparent 62%);
    opacity: .40; filter: blur(28px);
}
:root[data-theme="dark"] body::before { opacity: .55; }

.container {
    max-width: var(--maxw); margin: 0 auto;
    padding: 0 max(12px, env(safe-area-inset-left)) 12px max(12px, env(safe-area-inset-right));
}
::selection { background: var(--tint-blue); }

/* Shared glass recipe: translucent fill, hairline edge, specular top,
   and an angular sheen across the upper-left shoulder. */
.glass {
    position: relative;
    background: var(--glass);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    border: 1px solid var(--edge);
    box-shadow: var(--sh-md), inset 0 1px 0 var(--spec), inset 0 -1px 0 var(--hair);
}
.glass::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(148deg, var(--sheen) 0%, transparent 38%, transparent 72%, var(--sheen) 100%);
    opacity: .8;
}
.glass > * { position: relative; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: var(--glass-solid); }
}

/* ============================================================
   Header
   ============================================================ */
.hero {
    position: relative; overflow: hidden;
    margin: 0 0 14px; padding: calc(11px + env(safe-area-inset-top)) 12px 13px;
    border-radius: 0 0 var(--r-2xl) var(--r-2xl);
    background: linear-gradient(142deg, var(--hdr-1), var(--hdr-2) 52%, var(--hdr-3));
    color: var(--hdr-fg); box-shadow: var(--sh-md);
}
/* Angular specular sweep across the header glass. */
.hero::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
        linear-gradient(112deg, var(--hdr-sheen) 0%, transparent 48%),
        radial-gradient(240px 130px at 92% -30%, var(--hdr-spec), transparent 70%);
}
.hero-inner {
    position: relative; z-index: 1;
    max-width: var(--maxw); margin: 0 auto;
    padding: 0 max(4px, env(safe-area-inset-left)) 0 max(4px, env(safe-area-inset-right));
}
.hero-top { display: flex; align-items: center; gap: 11px; }
.brand-mark {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--num); font-weight: 800; font-size: 17px; letter-spacing: -.6px;
    background: linear-gradient(155deg, var(--hdr-glass-2), transparent);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid var(--hdr-edge);
    box-shadow: inset 0 1px 0 var(--hdr-spec), 0 4px 12px var(--sh-cast-soft);
}
.brand-text { min-width: 0; flex: 1; }
.brand-text h1 {
    margin: 0; font-size: 18.5px; font-weight: 800; letter-spacing: -.4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-text p { margin: 1px 0 0; font-size: 11.5px; opacity: .74; font-weight: 500; }
.hero-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
    width: 38px; height: 38px; border-radius: 13px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--hdr-glass); border: 1px solid var(--hdr-edge);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: var(--hdr-fg); cursor: pointer;
    box-shadow: inset 0 1px 0 var(--hdr-spec);
    transition: transform .16s var(--ease), background .2s;
}
.icon-btn:active { transform: scale(.9); background: var(--hdr-glass-2); }

/* ============================================================
   Floating glass tab dock
   ============================================================ */
.tabbar {
    position: fixed; z-index: 100;
    left: 50%; transform: translateX(-50%);
    bottom: calc(11px + env(safe-area-inset-bottom));
    width: min(calc(100% - 22px), 560px);
    display: flex; gap: 3px; padding: 7px;
    border-radius: var(--r-2xl);
    background: var(--glass);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    backdrop-filter: blur(30px) saturate(200%);
    border: 1px solid var(--edge);
    box-shadow: var(--sh-lg), inset 0 1px 0 var(--spec);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .tabbar { background: var(--glass-solid); }
}
.tabbar button {
    position: relative; flex: 1; min-height: var(--tap);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: none; border: none; border-radius: var(--r-lg);
    padding: 7px 2px; font-family: inherit;
    font-size: 10.5px; font-weight: 700; letter-spacing: .1px;
    color: var(--muted); cursor: pointer;
    transition: color .22s, background .22s, transform .16s var(--ease);
}
.tabbar button .i { width: 21px; height: 21px; vertical-align: 0; transition: transform .26s var(--ease); }
.tabbar button:active { transform: scale(.94); }
.tabbar button.active {
    color: var(--strong-fg);
    background: linear-gradient(150deg, var(--strong-2), var(--strong));
    box-shadow: 0 4px 14px color-mix(in srgb, var(--strong-2) 42%, transparent), inset 0 1px 0 var(--gloss);
}
.tabbar button.active .i { transform: translateY(-1px) scale(1.06); }

/* ============================================================
   Cards & typography
   ============================================================ */
.card {
    position: relative;
    background: var(--glass);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    border: 1px solid var(--edge);
    border-radius: var(--r-xl); padding: 17px; margin-bottom: 12px;
    box-shadow: var(--sh-md), inset 0 1px 0 var(--spec);
}
.card::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(148deg, var(--sheen) 0%, transparent 40%);
}
.card > * { position: relative; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .card { background: var(--glass-solid); }
}
.card h3 {
    display: flex; align-items: center; gap: 9px;
    margin: 0 0 13px; font-size: 15.5px; font-weight: 800; letter-spacing: -.25px; color: var(--text);
}
/* Angular accent notch instead of a plain bar. */
.card h3::before {
    content: ''; width: 5px; height: 17px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--strong-2), var(--strong));
    clip-path: polygon(0 0, 100% 12%, 100% 100%, 0 88%);
    border-radius: 2px;
}
.card h3 .i { color: var(--strong-2); }
label {
    display: block; font-size: 11px; font-weight: 700; margin-bottom: 6px;
    color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
}
.meta { font-size: 12.5px; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); }
.empty .big { margin-bottom: 12px; }
.empty .big .i { width: 46px; height: 46px; color: var(--strong-2); opacity: .55; }

.tab-panel { animation: riseIn .36s var(--ease) both; }
@keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ============================================================
   Icons
   ============================================================ */
.i { width: 20px; height: 20px; flex-shrink: 0; display: inline-block; vertical-align: -4px; }
.i-xs { width: 14px; height: 14px; vertical-align: -2px; }
.i-sm { width: 16px; height: 16px; vertical-align: -3px; }
.i-lg { width: 24px; height: 24px; vertical-align: -5px; }
.i-king { color: var(--gold); }
.i-joker { color: var(--violet); }
.i-cross { color: var(--red); }
.i-stack { position: relative; display: inline-block; width: 20px; height: 20px; vertical-align: -4px; flex-shrink: 0; }
.i-stack.i-sm { width: 16px; height: 16px; vertical-align: -3px; }
.i-stack .i { position: absolute; inset: 0; width: 100%; height: 100%; vertical-align: 0; }

/* ============================================================
   Form controls
   ============================================================ */
input, select, textarea {
    width: 100%; padding: 12px; font-family: inherit;
    border: 1px solid var(--hair); border-radius: var(--r);
    font-size: 16px; /* 16px keeps iOS from zooming on focus */
    background: var(--field); color: var(--text);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: inset 0 1px 2px var(--sh-inset);
    transition: border-color .18s, background .18s, box-shadow .18s;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .85; }
input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--strong-2); background: var(--field-on);
    box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--strong-2) 20%, transparent);
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg2 button {
    min-height: 42px; padding: 10px 4px; font-family: inherit;
    border: 1px solid var(--hair); border-radius: var(--r);
    background: var(--field); color: var(--muted);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-weight: 700; font-size: 13.5px; cursor: pointer;
    box-shadow: inset 0 1px 0 var(--spec);
    transition: all .18s var(--ease);
}
.seg2 button:active { transform: scale(.97); }
.seg2 button.on-t1 { background: linear-gradient(150deg, color-mix(in srgb, var(--blue) 88%, var(--lighten)), var(--blue)); color: var(--on-accent); border-color: transparent; box-shadow: 0 4px 13px color-mix(in srgb, var(--blue) 42%, transparent), inset 0 1px 0 var(--gloss); }
.seg2 button.on-t2 { background: linear-gradient(150deg, color-mix(in srgb, var(--red) 88%, var(--lighten)), var(--red)); color: var(--on-accent); border-color: transparent; box-shadow: 0 4px 13px color-mix(in srgb, var(--red) 42%, transparent), inset 0 1px 0 var(--gloss); }
.seg2 button.on-made { background: linear-gradient(150deg, color-mix(in srgb, var(--green) 88%, var(--lighten)), var(--green)); color: var(--on-accent); border-color: transparent; }
.seg2 button.on-lost { background: linear-gradient(150deg, color-mix(in srgb, var(--red) 88%, var(--lighten)), var(--red)); color: var(--on-accent); border-color: transparent; }

.btn {
    position: relative; overflow: hidden;
    width: 100%; min-height: var(--tap); padding: 13px 16px; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    border: 1px solid transparent; border-radius: var(--r-lg);
    background: linear-gradient(150deg, var(--strong-2), var(--strong));
    color: var(--strong-fg); font-size: 15px; font-weight: 800; letter-spacing: .1px;
    cursor: pointer;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--strong) 34%, transparent), inset 0 1px 0 var(--gloss);
    transition: transform .15s var(--ease), box-shadow .2s, filter .2s;
}
/* Angular specular streak across the button face. */
.btn::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(112deg, var(--gloss-strong) 0%, transparent 52%);
}
.btn:active { transform: scale(.975); filter: brightness(1.07); }
.btn .i { position: relative; }
.btn.green { background: linear-gradient(150deg, color-mix(in srgb, var(--green) 80%, var(--lighten)), color-mix(in srgb, var(--green) 78%, var(--chart-shadow))); box-shadow: 0 6px 18px color-mix(in srgb, var(--green) 34%, transparent), inset 0 1px 0 var(--gloss); }
.btn.blue { background: linear-gradient(150deg, color-mix(in srgb, var(--blue) 80%, var(--lighten)), color-mix(in srgb, var(--blue) 74%, var(--chart-shadow))); box-shadow: 0 6px 18px color-mix(in srgb, var(--blue) 34%, transparent), inset 0 1px 0 var(--gloss); }
.btn.danger { background: linear-gradient(150deg, color-mix(in srgb, var(--red) 82%, var(--lighten)), color-mix(in srgb, var(--red) 76%, var(--chart-shadow))); box-shadow: 0 6px 18px color-mix(in srgb, var(--red) 34%, transparent), inset 0 1px 0 var(--gloss); }
.btn.subtle {
    background: var(--field); color: var(--primary);
    border: 1px solid var(--hair);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 var(--spec);
}
.btn.subtle::after { background: linear-gradient(112deg, var(--sheen) 0%, transparent 46%); }
.btn.small { width: auto; min-height: 34px; padding: 7px 13px; font-size: 12px; gap: 6px; border-radius: var(--r-sm); }
/* Side-by-side buttons get tighter padding so their labels stay on one line. */
.row .btn { padding: 13px 8px; gap: 7px; white-space: nowrap; }
.btn.small .i { width: 15px; height: 15px; }

.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; }
.add-row button { width: auto; padding: 0 20px; flex-shrink: 0; }

.chip-toggle {
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
    padding: 7px 13px; border-radius: 999px; font-family: inherit;
    border: 1px solid var(--hair); background: var(--field);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    font-size: 13px; font-weight: 650; color: var(--muted); cursor: pointer;
    box-shadow: inset 0 1px 0 var(--spec);
    transition: all .18s var(--ease);
}
.chip-toggle:active { transform: scale(.96); }
.chip-toggle.on { background: var(--tint-green); border-color: color-mix(in srgb, var(--green) 55%, transparent); color: var(--on-green); }

/* ============================================================
   Avatars
   ============================================================ */
.avi {
    width: 31px; height: 31px; border-radius: 11px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--num); font-size: 11.5px; font-weight: 800; color: var(--on-accent);
    letter-spacing: -.2px;
    box-shadow: 0 3px 9px var(--sh-cast), inset 0 1px 0 var(--gloss);
}
.avi.sm { width: 26px; height: 26px; border-radius: 9px; font-size: 10px; }
.avi.lg { width: 58px; height: 58px; border-radius: 20px; font-size: 20px; }

/* ============================================================
   Roster list
   ============================================================ */
.roster-list { display: flex; flex-direction: column; }
.roster-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 0; border-bottom: 1px solid var(--hair);
}
.roster-item:last-child { border-bottom: none; }
.roster-item.picked {
    background: var(--tint-green); border-radius: var(--r);
    padding-left: 9px; padding-right: 9px; margin: 0 -9px;
    border-bottom-color: transparent;
}
.roster-item .rname {
    flex: 1; min-width: 0; font-weight: 650; font-size: 14.5px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.roster-item .lb-sub { margin-left: auto; padding-right: 4px; }
.guest-tag {
    font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
    background: var(--tint-amber); color: var(--on-amber);
    padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
}
.mini-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    min-height: 33px; padding: 5px 12px; font-family: inherit;
    border: 1px solid var(--hair); border-radius: 999px;
    background: var(--field); font-size: 11.5px; font-weight: 700;
    color: var(--muted); cursor: pointer; flex-shrink: 0;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 0 var(--spec);
    transition: all .18s var(--ease);
}
.mini-toggle:active { transform: scale(.95); }
.mini-toggle .i { width: 14px; height: 14px; vertical-align: 0; }
.mini-toggle.on { background: var(--tint-amber); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--on-amber); }
.mini-toggle.go.on { background: var(--tint-green); border-color: color-mix(in srgb, var(--green) 55%, transparent); color: var(--on-green); }
.mini-toggle.sel.on {
    background: linear-gradient(150deg, var(--strong-2), var(--strong));
    border-color: transparent; color: var(--strong-fg);
    box-shadow: 0 3px 10px color-mix(in srgb, var(--strong-2) 38%, transparent), inset 0 1px 0 var(--gloss);
}
.mini-btn {
    width: 35px; height: 35px; flex-shrink: 0; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--hair); border-radius: var(--r-sm);
    background: var(--field); cursor: pointer; color: var(--blue);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 0 var(--spec);
    transition: all .18s var(--ease);
}
.mini-btn:active { transform: scale(.92); }
.mini-btn .i { width: 16px; height: 16px; vertical-align: 0; }
.mini-btn.danger { color: var(--red); }
.guest-check {
    display: inline-flex; align-items: center; gap: 9px; margin-top: 12px;
    font-size: 13.5px; font-weight: 650; color: var(--text);
    text-transform: none; letter-spacing: 0; cursor: pointer;
}
.guest-check .box {
    width: 23px; height: 23px; border: 1px solid var(--hair); border-radius: 8px;
    background: var(--field);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--on-accent); transition: all .18s var(--ease);
}
.guest-check .box .i { width: 15px; height: 15px; vertical-align: 0; }
.guest-check .box.on {
    background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 85%, var(--lighten)), var(--accent));
    border-color: transparent;
    box-shadow: 0 3px 9px color-mix(in srgb, var(--accent) 42%, transparent);
}

/* ============================================================
   Badges
   ============================================================ */
.badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 10.5px; font-weight: 800; letter-spacing: .3px;
    margin: 2px 4px 2px 0; background: var(--tint-neutral); color: var(--muted);
}
.badge.made { background: var(--tint-green); color: var(--on-green); }
.badge.lost { background: var(--tint-red); color: var(--on-red); }
.badge.thani { background: var(--tint-amber); color: var(--on-amber); }
.badge.manual { background: var(--tint-violet); color: var(--on-violet); }

/* ============================================================
   Podium (season leaders)
   ============================================================ */
.podium {
    position: relative; overflow: hidden;
    background: var(--glass);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    border: 1px solid var(--edge);
    border-radius: var(--r-xl); padding: 17px 14px 15px; margin-bottom: 12px;
    box-shadow: var(--sh-md), inset 0 1px 0 var(--spec);
}
.podium::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
        linear-gradient(148deg, var(--sheen) 0%, transparent 40%),
        radial-gradient(330px 160px at 50% -34%, color-mix(in srgb, var(--gold) 30%, transparent), transparent 72%);
}
.podium > * { position: relative; }
.podium-title {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 10.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin-bottom: 14px;
}
.podium-title .i { width: 16px; height: 16px; vertical-align: 0; color: var(--gold); }
.podium-row { display: flex; align-items: flex-end; justify-content: center; gap: 8px; }
.pod { flex: 1; max-width: 124px; text-align: center; }
.pod .crown { height: 22px; margin-bottom: 3px; }
.pod .crown .i { width: 21px; height: 21px; vertical-align: 0; }
.pod.p1 .crown .i { color: var(--gold); }
.pod.p2 .crown .i { color: var(--medal-2flat); }
.pod.p3 .crown .i { color: var(--medal-3flat); }
.pod .avi { margin: 0 auto 7px; }
.pod .pname {
    font-size: 12.5px; font-weight: 750; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pod .ppts { font-family: var(--num); font-size: 17px; font-weight: 850; letter-spacing: -.4px; margin-top: 1px; }
.pod .psub { font-size: 10.5px; color: var(--muted); font-weight: 600; }
.pod .plinth {
    margin-top: 8px; border-radius: 14px 14px 7px 7px;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 7px; font-family: var(--num); font-weight: 850; font-size: 14px;
    box-shadow: inset 0 1px 0 var(--gloss-strong), 0 6px 16px var(--sh-cast-soft);
}
.pod.p1 .plinth { height: 56px; background: linear-gradient(168deg, var(--medal-1a), var(--medal-1b)); color: var(--medal-1ink); }
.pod.p2 .plinth { height: 42px; background: linear-gradient(168deg, var(--medal-2a), var(--medal-2b)); color: var(--medal-2ink); }
.pod.p3 .plinth { height: 33px; background: linear-gradient(168deg, var(--medal-3a), var(--medal-3b)); color: var(--medal-3ink); }
.pod.p1 .avi { width: 58px; height: 58px; border-radius: 20px; font-size: 20px; box-shadow: 0 8px 22px color-mix(in srgb, var(--gold) 48%, transparent), inset 0 1px 0 var(--gloss-strong); }
.pod.p1 .ppts { font-size: 20px; }

/* ============================================================
   Stat tiles
   ============================================================ */
/* auto-fit sizes off the real container width, so this reflows on any screen */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat-tile {
    position: relative; overflow: hidden;
    background: var(--glass-2); border: 1px solid var(--hair);
    border-radius: var(--r-lg); padding: 12px 14px;
    box-shadow: inset 0 1px 0 var(--spec);
}
.stat-tile::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(140deg, var(--sheen), transparent 52%);
}
.stat-tile > * { position: relative; }
.stat-tile .sv {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--num); font-size: 23px; font-weight: 850;
    letter-spacing: -.8px; line-height: 1.1;
}
.stat-tile .sv .i { width: 21px; height: 21px; vertical-align: 0; }
.stat-tile .sl {
    font-size: 10.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; margin-top: 4px;
}
.stat-tile.blue .sv { color: var(--blue); }
.stat-tile.green .sv { color: var(--green); }
.stat-tile.amber .sv { color: var(--accent); }
.stat-tile.violet .sv { color: var(--violet); }

/* ============================================================
   Leaderboard list rows
   ============================================================ */
.lb-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.lb-row:last-child { border-bottom: none; }
.lb-rank {
    width: 26px; height: 26px; border-radius: 9px; background: var(--tint-neutral); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--num); font-weight: 850; font-size: 12px; flex-shrink: 0;
}
.lb-rank.r1 { background: linear-gradient(160deg, var(--medal-1a), var(--medal-1b)); color: var(--medal-1ink); box-shadow: inset 0 1px 0 var(--gloss-strong); }
.lb-rank.r2 { background: linear-gradient(160deg, var(--medal-2a), var(--medal-2b)); color: var(--medal-2ink); box-shadow: inset 0 1px 0 var(--gloss-strong); }
.lb-rank.r3 { background: linear-gradient(160deg, var(--medal-3a), var(--medal-3b)); color: var(--medal-3ink); box-shadow: inset 0 1px 0 var(--gloss-strong); }
.lb-name { flex: 1; font-weight: 650; font-size: 14.5px; }
.lb-pts { font-family: var(--num); font-weight: 850; font-size: 16px; letter-spacing: -.3px; }
.lb-sub { font-size: 11px; color: var(--muted); font-weight: 600; }

/* ============================================================
   Tables
   ============================================================ */
.lb-sort, .lb-view { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
.lb-view {
    gap: 4px; padding: 4px; border-radius: var(--r-lg);
    background: var(--glass-2); border: 1px solid var(--hair);
    box-shadow: inset 0 1px 0 var(--spec);
}
.lb-sort button, .lb-view button {
    flex: 1 1 128px; min-height: 34px; padding: 6px 8px; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    border: none; border-radius: var(--r); background: transparent;
    font-weight: 700; font-size: 11.5px; color: var(--muted); cursor: pointer;
    white-space: nowrap; transition: all .2s var(--ease);
}
.lb-view button .i { width: 15px; height: 15px; vertical-align: 0; }
.lb-sort button { flex: 0 0 auto; border: 1px solid var(--hair); background: var(--field); }
.lb-view button.on, .lb-sort button.on {
    background: linear-gradient(150deg, var(--strong-2), var(--strong));
    color: var(--strong-fg);
    box-shadow: 0 4px 12px color-mix(in srgb, var(--strong-2) 36%, transparent), inset 0 1px 0 var(--gloss);
}
.lb-table-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin: 0 -17px; padding: 0 17px;
    scrollbar-width: thin;
}
.lb-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.lb-table th, .lb-table td {
    padding: 9px 6px; text-align: center;
    border-bottom: 1px solid var(--hair); white-space: nowrap;
}
.lb-table thead th {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); font-weight: 800; vertical-align: middle;
}
.lb-table thead th .i { vertical-align: 0; }
.lb-table th.col-name, .lb-table td.col-name {
    position: sticky; left: -17px; z-index: 2;
    text-align: left; white-space: normal;
    background: var(--glass-solid); padding-left: 0;
    min-width: 154px; max-width: 190px;
    box-shadow: 10px 0 10px -10px var(--sh-col);
}
.lb-table td.col-name { font-weight: 650; }
.lb-table .name-cell { display: flex; align-items: center; gap: 8px; padding-right: 10px; }
.lb-table .name-cell .nm { min-width: 0; flex: 1; }
.lb-table .name-cell .nt { display: flex; align-items: center; gap: 5px; line-height: 1.3; }
.lb-table .name-cell .nt > :first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-table .name-cell .lb-sub { display: block; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-table td.lb-pts-cell { font-family: var(--num); font-weight: 850; letter-spacing: -.2px; }
.lb-table .sorted { background: var(--sorted-bg); }
.lb-table td.col-name.sorted, .lb-table th.col-name.sorted { background: var(--glass-solid); }
.lb-table thead th.sorted { color: var(--primary); }
.lb-table thead th.sortable { cursor: pointer; user-select: none; -webkit-user-select: none; }
.lb-table .sort-caret { display: inline-block; width: 10px; height: 10px; vertical-align: 0; }
.lb-table tbody tr:last-child td { border-bottom: none; }
.wk-table th, .wk-table td { min-width: 48px; }
.wk-bonus { color: var(--accent); font-weight: 700; font-size: 11px; margin-left: 1px; }
.wk-empty { color: var(--muted); opacity: .6; }

/* ============================================================
   Charts
   ============================================================ */
.chart-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin: 6px -17px 2px; padding: 0 17px; border-radius: var(--r);
}
.bump-svg { display: block; }
.bump-plot { fill: var(--chart-plot); }
.bump-stripe { fill: var(--chart-stripe); }
.bump-lead { fill: var(--gold); }
.bump-path { fill: none; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; transition: opacity .18s ease, stroke-width .18s ease; }
.bump-grid { stroke: var(--hair); stroke-dasharray: 2 4; }
.bump-vgrid { stroke: var(--hair); stroke-dasharray: 2 5; }
.bump-axis { fill: var(--muted); font-size: 10px; font-family: inherit; }
.bump-wk { fill: var(--text); font-size: 11px; font-weight: 700; font-family: inherit; }
.bump-date { fill: var(--muted); font-size: 9px; font-family: inherit; }
.bump-rank { fill: var(--muted); font-size: 11px; font-weight: 700; font-family: inherit; }
.bump-pill-txt { font-family: inherit; font-weight: 700; font-size: 11px; fill: var(--chart-pill-ink); cursor: pointer; }
.bump-medal { font-family: var(--num); font-weight: 800; font-size: 9.5px; }
.bump-dot { cursor: pointer; transition: opacity .18s ease; }

/* ============================================================
   Matchup (teams per game week)
   ============================================================ */
.matchup { display: flex; align-items: stretch; gap: 8px; margin-top: 12px; }
.matchup .team {
    flex: 1; position: relative; overflow: hidden;
    background: var(--glass-2); border: 1px solid var(--hair);
    border-radius: var(--r-lg); padding: 12px 9px; text-align: center;
    box-shadow: inset 0 1px 0 var(--spec);
}
.matchup .team::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; }
.matchup .team.t1::before { background: linear-gradient(90deg, var(--blue), color-mix(in srgb, var(--blue) 40%, transparent)); }
.matchup .team.t2::before { background: linear-gradient(90deg, var(--red), color-mix(in srgb, var(--red) 40%, transparent)); }
.matchup .team.win { background: var(--tint-green); border-color: color-mix(in srgb, var(--green) 42%, transparent); }
.matchup .team .tlabel { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
.matchup .team.t1 .tlabel { color: var(--on-blue); }
.matchup .team.t2 .tlabel { color: var(--on-red); }
.matchup .team .tscore { font-family: var(--num); font-size: 27px; font-weight: 850; letter-spacing: -1px; margin: 2px 0 4px; }
.matchup .team .tplayers { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.tp {
    background: var(--field-on); border: 1px solid var(--hair); border-radius: 999px;
    padding: 3px 10px; font-size: 11.5px; font-weight: 650; color: var(--text-2);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    box-shadow: inset 0 1px 0 var(--spec);
}
.tp-none { font-size: 12px; color: var(--muted); }
.matchup .vs {
    align-self: center; flex-shrink: 0; font-size: 10px; font-weight: 800;
    color: var(--muted); letter-spacing: .5px;
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--field-on); border: 1px solid var(--hair);
    box-shadow: inset 0 1px 0 var(--spec);
}
.score-caption {
    text-align: center; font-size: 10px; color: var(--muted);
    margin-top: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
}

/* Week card header */
.week-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.week-head .wk-no { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.week-head .wk-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.wk-chip {
    font-family: var(--num); font-size: 12px; font-weight: 850; letter-spacing: -.2px;
    padding: 5px 11px; border-radius: 999px;
    background: linear-gradient(150deg, var(--strong-2), var(--strong)); color: var(--strong-fg);
    box-shadow: 0 3px 10px color-mix(in srgb, var(--strong-2) 34%, transparent), inset 0 1px 0 var(--gloss);
}
.wk-date { font-size: 12.5px; color: var(--muted); font-weight: 650; }

/* ============================================================
   Add-a-game-day rows
   ============================================================ */
.past-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; border-bottom: 1px solid var(--hair);
}
.past-row:last-of-type { border-bottom: none; }
.past-row .past-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.past-seg { width: 100px; flex-shrink: 0; gap: 6px; }
.past-seg button { min-height: 38px; padding: 7px 4px; font-size: 13px; }
.past-pts { width: 60px; flex-shrink: 0; padding: 9px 4px; text-align: center; font-size: 15px; }
.past-pts-empty { width: 60px; flex-shrink: 0; }

.tally-row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.tally-row .tname { flex: 1; font-weight: 650; font-size: 14px; }
.tally-row input { width: 92px; flex-shrink: 0; text-align: center; padding: 9px; }

/* 12-0 round editor */
.ko-round {
    border: 1px solid var(--hair); border-radius: var(--r-lg);
    padding: 13px; margin-bottom: 10px; background: var(--glass-2);
    box-shadow: inset 0 1px 0 var(--spec);
}
.ko-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ko-jokers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.lb-badges { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 12px; }
.lb-badges span { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 700; color: var(--text); }

/* 12-0 rounds summary on a week card */
.ko-summary { margin-top: 11px; border-top: 1px dashed var(--hair); padding-top: 10px; }
.ko-summary-title { font-size: 9.5px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .6px; text-align: center; margin-bottom: 5px; }
.ko-line { font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap; margin: 3px 0; }
.ko-rn { font-weight: 700; color: var(--muted); font-size: 11px; }
.ko-line .ko-t1 { color: var(--on-blue); font-weight: 750; }
.ko-line .ko-t2 { color: var(--on-red); font-weight: 750; }
.ko-lift { display: inline-flex; align-items: center; gap: 4px; color: var(--text); }

/* ============================================================
   Data tab
   ============================================================ */
textarea {
    min-height: 150px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; line-height: 1.5;
}

/* ============================================================
   Login
   ============================================================ */
.login-overlay {
    position: fixed; inset: 0; z-index: 500; overflow-y: auto;
    background: var(--bg);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 11vh 16px calc(24px + env(safe-area-inset-bottom));
}
.login-overlay::before {
    content: ''; position: fixed; inset: -10%; z-index: 0; pointer-events: none;
    background:
        radial-gradient(38vmax 30vmax at 16% 0%, var(--blob-1), transparent 62%),
        radial-gradient(34vmax 28vmax at 92% 18%, var(--blob-2), transparent 60%),
        radial-gradient(40vmax 30vmax at 50% 102%, var(--blob-3), transparent 62%);
    opacity: .5; filter: blur(30px);
}
.login-box {
    position: relative; z-index: 1;
    background: var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid var(--edge); border-radius: var(--r-2xl);
    padding: 32px 24px 26px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: var(--sh-lg), inset 0 1px 0 var(--spec);
    animation: riseIn .42s var(--ease) both;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .login-box { background: var(--glass-solid); }
}
.login-box .logo {
    position: relative;
    width: 64px; height: 64px; margin: 0 auto 15px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--num); font-size: 24px; font-weight: 850; color: var(--hdr-fg); letter-spacing: -1px;
    background: linear-gradient(150deg, var(--hdr-3), var(--hdr-1));
    box-shadow: 0 12px 28px color-mix(in srgb, var(--hdr-2) 48%, transparent), inset 0 1px 0 var(--hdr-spec);
    overflow: hidden;
}
.login-box .logo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(112deg, var(--hdr-sheen) 0%, transparent 46%);
}
.login-box h2 { margin: 0 0 4px; color: var(--text); font-size: 21px; font-weight: 850; letter-spacing: -.4px; }
.login-box .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.login-box input { margin-bottom: 10px; text-align: center; }
.login-err { color: var(--red); font-size: 13px; font-weight: 650; min-height: 18px; margin-bottom: 8px; }

/* ============================================================
   Toast
   ============================================================ */
.toast {
    position: fixed; left: 50%; z-index: 200; pointer-events: none;
    bottom: calc(112px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(16px) scale(.96);
    background: var(--glass); color: var(--text);
    -webkit-backdrop-filter: blur(24px) saturate(190%);
    backdrop-filter: blur(24px) saturate(190%);
    border: 1px solid var(--edge);
    padding: 11px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 700; opacity: 0;
    transition: opacity .26s var(--ease), transform .26s var(--ease);
    max-width: min(90%, 420px); text-align: center;
    box-shadow: var(--sh-lg), inset 0 1px 0 var(--spec);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<div class="login-overlay" id="login-overlay" style="display:none;">
    <div class="login-box">
        <div class="logo">56</div>
        <h2>Fifty Six League</h2>
        <div class="sub">Thuruppu weekly score tracker</div>
        <input id="login-user" type="text" placeholder="Username" autocomplete="username">
        <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="login-err" id="login-err"></div>
        <button class="btn" onclick="doLogin()">Sign in</button>
    </div>
</div>

<header class="hero">
    <div class="hero-inner">
        <div class="hero-top">
            <div class="brand-mark">56</div>
            <div class="brand-text">
                <h1>Fifty Six League</h1>
                <p>Thuruppu weekly score tracker</p>
            </div>
            <div class="hero-actions">
                <button class="icon-btn" id="theme-btn" title="Theme" aria-label="Switch theme" onclick="cycleTheme()"></button>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div id="tab-season" class="tab-panel"></div>
    <div id="tab-teams" class="tab-panel" style="display:none;"></div>
    <div id="tab-roster" class="tab-panel" style="display:none;"></div>
    <div id="tab-data" class="tab-panel" style="display:none;"></div>
</div>

<nav class="tabbar">
    <button class="active" data-tab="season" onclick="switchTab('season')" aria-label="Season">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Season</button>
    <button data-tab="teams" onclick="switchTab('teams')" aria-label="Teams">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.2" cy="8.2" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.8" cy="8.2" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="8.2" cy="15.8" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.8" cy="15.8" r="1.15" fill="currentColor" stroke="none"/></svg>Teams</button>
    <button data-tab="roster" onclick="switchTab('roster')" aria-label="Roster">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Roster</button>
    <button data-tab="data" onclick="switchTab('data')" aria-label="Data">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>Data</button>
</nav>

<div class="toast" id="toast"></div>
<script>
const API = '/api/data';
let saveTimer = null;

/* ---------- SVG icon set ----------
   One 24x24 grid, stroked with currentColor unless `fill` is set, so any icon
   inherits the colour and size of whatever it sits in. Use icon(name, extraCls).
   `raw` carries markup that isn't a plain <path> (circles, rects, mixed fills). */
const ICON_SET = {
    trophy: ['M6 9H4.5a2.5 2.5 0 0 1 0-5H6', 'M18 9h1.5a2.5 2.5 0 0 0 0-5H18', 'M4 22h16',
        'M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22',
        'M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22', 'M18 2H6v7a6 6 0 0 0 12 0V2Z'],
    crown: ['M11.56 3.27a.5.5 0 0 1 .88 0l2.95 5.6a1 1 0 0 0 1.51.3l4.28-3.67a.5.5 0 0 1 .8.52l-2.84 10.25a1 1 0 0 1-.95.73H5.81a1 1 0 0 1-.96-.73L2.02 6.02a.5.5 0 0 1 .8-.52l4.27 3.67a1 1 0 0 0 1.52-.3z', 'M5 21h14'],
    medal: ['M6 3h12', 'm8.6 3 3.4 7', 'm15.4 3-3.4 7'],
    medalRaw: '<circle cx="12" cy="15.6" r="6"/>',
    joker: { fill: true, raw: '<path d="M5 13h14a1.7 1.7 0 0 1 1.7 1.7v.6A1.7 1.7 0 0 1 19 17H5a1.7 1.7 0 0 1-1.7-1.7v-.6A1.7 1.7 0 0 1 5 13z"/><path d="M7.2 13 3.6 6.9 8.9 10z"/><path d="M9.9 12 12 4.3 14.1 12z"/><path d="M16.8 13 20.4 6.9 15.1 10z"/><circle cx="3" cy="6" r="1.5"/><circle cx="12" cy="3.4" r="1.5"/><circle cx="21" cy="6" r="1.5"/>' },
    cross: { width: 2.6, d: ['M6 6l12 12', 'M18 6L6 18'] },
    plus: ['M5 12h14', 'M12 5v14'],
    check: ['M20 6 9 17l-5-5'],
    x: ['M18 6 6 18', 'M6 6l12 12'],
    pencil: ['M21.17 6.81a1 1 0 0 0-3.98-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.63l4.35-1.32a2 2 0 0 0 .83-.5z', 'm15 5 4 4'],
    shuffle: ['M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22', 'm18 2 4 4-4 4',
        'M2 6h1.9c1.5 0 2.9.9 3.6 2.2', 'M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8', 'm18 14 4 4-4 4'],
    refresh: ['M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8', 'M21 3v5h-5',
        'M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16', 'M8 16H3v5'],
    download: ['M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4', 'm7 10 5 5 5-5', 'M12 15V3'],
    upload: ['M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4', 'm17 8-5-5-5 5', 'M12 3v12'],
    lineChart: ['M3 3v16a2 2 0 0 0 2 2h16', 'm19 9-5 5-4-4-3 3'],
    barChart: ['M3 3v16a2 2 0 0 0 2 2h16', 'M18 17V9', 'M13 17V5', 'M8 17v-3'],
    calendar: { raw: '<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>' },
    users: ['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2', 'M22 21v-2a4 4 0 0 0-3-3.87', 'M16 3.13a4 4 0 0 1 0 7.75'],
    usersRaw: '<circle cx="9" cy="7" r="4"/>',
    database: { raw: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>' },
    logOut: ['M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4', 'm16 17 5-5-5-5', 'M21 12H9'],
    copy: { raw: '<rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>' },
    sun: { raw: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>' },
    moon: ['M20.35 15.32A9 9 0 1 1 8.68 3.65a7.2 7.2 0 0 0 11.67 11.67Z'],
    auto: { raw: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/>' },
    caret: { fill: true, raw: '<path d="M12 16 5 8h14z"/>' }
};
function icon(name, cls) {
    let s = ICON_SET[name];
    if (!s) return '';
    if (Array.isArray(s)) s = { d: s };
    const body = (s.raw || '') + (ICON_SET[name + 'Raw'] || '') +
        (s.d || []).map(d => '<path d="' + d + '"/>').join('');
    const paint = s.fill
        ? 'fill="currentColor" stroke="none"'
        : 'fill="none" stroke="currentColor" stroke-width="' + (s.width || 1.9) + '" stroke-linecap="round" stroke-linejoin="round"';
    return '<svg class="i ' + (cls || '') + '" viewBox="0 0 24 24" ' + paint + ' aria-hidden="true">' + body + '</svg>';
}
const iconKing = cls => icon('crown', 'i-king ' + (cls || ''));
const iconJoker = cls => icon('joker', 'i-joker ' + (cls || ''));
// Lifted Joker = the cross sits on top of the Joker icon.
function iconCrossed(sm) {
    return '<span class="i-stack' + (sm ? ' i-sm' : '') + '" title="Joker lifted">' +
        iconJoker() + icon('cross', 'i-cross') + '</span>';
}

let state = {
    data: { season: [], roster: [], guests: [] },
    newGuest: false,
    activeTab: 'season',
    newPlayerName: '',
    lbSort: 'points',
    lbView: 'ranking',
    lbHighlight: null,
    showPast: false,
    past: { date: '', team: {}, score1: '', score2: '', points: {}, ko: [] },
    shuffle: { picked: {}, team1: [], team2: [], done: false, tol: 0.2 },
    editWeek: null,
    editBuf: null
};

/* ---------- persistence ---------- */
// Each game week carries a stable id used as its storage key (one blob per week).
function genId() {
    return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function ensureWeekIds() {
    (state.data.season || []).forEach(w => { if (!w.id) w.id = genId(); });
}
function localLoad() {
    try {
        const saved = localStorage.getItem('thuruppu-data');
        if (saved) state.data = JSON.parse(saved);
        if (!state.data.roster) state.data.roster = state.data.savedPlayers || [];
        if (!state.data.guests) state.data.guests = [];
    } catch (e) {}
    ensureWeekIds();
}
function localSave() {
    try {
        localStorage.setItem('thuruppu-data', JSON.stringify(state.data));
    } catch (e) {}
}
/* ---------- auth ---------- */
function getToken() { try { return localStorage.getItem('thuruppu-token') || ''; } catch (e) { return ''; } }
function setToken(t) { try { t ? localStorage.setItem('thuruppu-token', t) : localStorage.removeItem('thuruppu-token'); } catch (e) {} }
function authHeaders() { return { 'Content-Type': 'application/json', 'x-auth-token': getToken() }; }

function showLogin(show) {
    document.getElementById('login-overlay').style.display = show ? 'flex' : 'none';
}

async function doLogin() {
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pass').value;
    const err = document.getElementById('login-err');
    err.textContent = '';
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const out = await res.json();
        if (out.ok && out.token) {
            setToken(out.token);
            showLogin(false);
            toast('Welcome!');
            serverLoad();
        } else {
            err.textContent = out.error || 'Wrong username or password';
        }
    } catch (e) {
        err.textContent = 'Cannot reach server. Check connection.';
    }
}

function logout() {
    setToken('');
    showLogin(true);
    toast('Signed out');
}

async function serverLoad() {
    if (!getToken()) { showLogin(true); setOnline(false); render(); return; }
    try {
        const res = await fetch(API, { headers: authHeaders() });
        if (res.status === 401) { showLogin(true); setOnline(false); render(); return; }
        if (!res.ok) throw new Error();
        const serverData = await res.json();
        if (serverData.season && serverData.season.length > 0) {
            state.data = serverData;
            if (!state.data.roster) state.data.roster = [];
            if (!state.data.guests) state.data.guests = [];
            ensureWeekIds();
            localSave();
        } else if (state.data.season.length > 0 || (state.data.roster && state.data.roster.length)) {
            serverSave();
        }
        setOnline(true);
    } catch (e) { setOnline(false); }
    render();
}
function serverSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
        try {
            const res = await fetch(API, { method: 'POST', headers: authHeaders(), body: JSON.stringify(state.data) });
            if (res.status === 401) { showLogin(true); setOnline(false); return; }
            if (!res.ok) {
                let msg = 'save failed (' + res.status + ')';
                try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
                setOnline(false, msg);
                return;
            }
            setOnline(true);
        } catch (e) { setOnline(false, 'network error'); }
    }, 400);
}
let wasOnline = null;
// No persistent status badge — sync is silent while it works. A failed save
// still toasts once, so data that only made it to this device isn't silent.
function setOnline(on, detail) {
    if (!on && detail && wasOnline !== false) toast('Save not synced: ' + detail);
    wasOnline = on;
}
function persist() { localSave(); serverSave(); }

/* ---------- helpers ---------- */
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function round2(n) { return Math.round(n * 100) / 100; }
// Single-quoted JS string literal, safe to drop into an inline onclick attribute.
function jsArg(s) { return "'" + esc(s).replace(/'/g, "\\'") + "'"; }

/* ---------- theme (light / dark / follow the device) ---------- */
const THEME_ICON = { auto: 'auto', light: 'sun', dark: 'moon' };
function applyTheme() {
    const root = document.documentElement;
    const pref = root.dataset.themePref || 'auto';
    const dark = pref === 'dark' || (pref === 'auto' &&
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.theme = dark ? 'dark' : 'light';
    const btn = document.getElementById('theme-btn');
    if (btn) {
        btn.innerHTML = icon(THEME_ICON[pref]);
        btn.title = 'Theme: ' + pref;
    }
}
function cycleTheme() {
    const order = ['auto', 'light', 'dark'];
    const root = document.documentElement;
    const next = order[(order.indexOf(root.dataset.themePref || 'auto') + 1) % order.length];
    root.dataset.themePref = next;
    try { localStorage.setItem('thuruppu-theme', next); } catch (e) {}
    applyTheme();
    render(); // charts bake resolved colours in, so redraw them
    toast(next === 'auto' ? 'Theme follows your device' : next === 'light' ? 'Light theme' : 'Dark theme');
}
if (window.matchMedia) {
    try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            applyTheme();
            render(); // charts bake resolved colours in, so redraw them
        });
    } catch (e) {}
}
// Resolve a theme token to a real colour. SVG presentation attributes can't
// rely on var(), so the chart builders read the palette through this.
function cssVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback || '';
}
// The categorical series palette, in theme-appropriate colours.
function chartPalette() {
    return ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7', '--c8'].map(n => cssVar(n));
}

/* ---------- player avatars ---------- */
// Deterministic hue per name so a player keeps the same colour everywhere.
function nameHue(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return h;
}
function initials(name) {
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
// Only the hue comes from the name; saturation and lightness are theme tokens,
// so avatars stay legible against whichever surface they land on.
function avatarHtml(name, cls) {
    const h = nameHue(name);
    const bg = 'linear-gradient(140deg,' +
        ' hsl(' + h + ' var(--avi-s1) var(--avi-l1)),' +
        ' hsl(' + ((h + 32) % 360) + ' var(--avi-s2) var(--avi-l2)))';
    return '<span class="avi ' + (cls || '') + '" style="background:' + bg + '" aria-hidden="true">' +
        esc(initials(name)) + '</span>';
}

/* ---------- roster ---------- */
function isGuest(name) { return (state.data.guests || []).includes(name); }
function guestTag(name) { return isGuest(name) ? ' <span class="guest-tag">Guest</span>' : ''; }
function toggleNewGuest() { state.newGuest = !state.newGuest; renderRosterTab(); }
function toggleGuest(name) {
    if (!state.data.guests) state.data.guests = [];
    if (isGuest(name)) state.data.guests = state.data.guests.filter(g => g !== name);
    else state.data.guests.push(name);
    persist();
    render();
    toast(name + (isGuest(name) ? ' marked as guest' : ' is now a regular'));
}
function addRosterPlayer() {
    const input = document.getElementById('new-player');
    const name = (input ? input.value : '').trim();
    if (!name) return;
    if (state.data.roster.includes(name)) { toast(name + ' is already in the roster'); return; }
    state.data.roster.push(name);
    state.data.roster.sort((a,b) => a.localeCompare(b));
    if (state.newGuest && !isGuest(name)) state.data.guests.push(name);
    persist();
    render();
    toast(name + (state.newGuest ? ' added as guest' : ' added to roster'));
}
function removeRosterPlayer(name) {
    if (!confirm('Remove ' + name + ' from roster? (Past game history is kept)')) return;
    state.data.roster = state.data.roster.filter(p => p !== name);
    state.data.guests = (state.data.guests || []).filter(g => g !== name);
    if (state.past && state.past.team) delete state.past.team[name];
    persist();
    render();
}
function renameRosterPlayer(oldName) {
    const newName = (prompt('Rename "' + oldName + '" to:', oldName) || '').trim();
    if (!newName || newName === oldName) return;
    if (state.data.roster.includes(newName)) { toast(newName + ' is already in the roster'); return; }
    const map = s => (s === oldName ? newName : s);

    state.data.roster = state.data.roster.map(map).sort((a, b) => a.localeCompare(b));
    state.data.guests = (state.data.guests || []).map(map);

    if (state.past) {
        if (state.past.team && state.past.team[oldName] !== undefined) {
            state.past.team[newName] = state.past.team[oldName]; delete state.past.team[oldName];
        }
        if (state.past.points && state.past.points[oldName] !== undefined) {
            state.past.points[newName] = state.past.points[oldName]; delete state.past.points[oldName];
        }
    }

    // Propagate the rename through all recorded history so stats stay attached.
    state.data.season.forEach(w => {
        if (w.players) {
            w.players.team1 = (w.players.team1 || []).map(map);
            w.players.team2 = (w.players.team2 || []).map(map);
        }
        (w.games || []).forEach(g => { g.team1 = (g.team1 || []).map(map); g.team2 = (g.team2 || []).map(map); });
        (w.rounds || []).forEach(r => { r.winnerPlayers = (r.winnerPlayers || []).map(map); });
        (w.koRounds || []).forEach(r => { r.crossed = (r.crossed || []).map(map); });
        if (w.finalTally && w.finalTally[oldName] !== undefined) {
            w.finalTally[newName] = w.finalTally[oldName]; delete w.finalTally[oldName];
        }
    });

    persist();
    render();
    toast('Renamed ' + oldName + ' to ' + newName);
}

/* ---------- Teams tab: balanced random shuffle ----------
   Pick who's playing today, then split into two teams weighted by each
   player's season points so the strongest players don't stack on one side. */
function seasonPointsByPlayer() {
    const pts = {};
    (state.data.season || []).forEach(w => {
        if (w.finalTally) Object.entries(w.finalTally).forEach(([p, v]) => {
            pts[p] = (pts[p] || 0) + (Number(v) || 0);
        });
    });
    return pts;
}
function toggleShufflePick(name) {
    state.shuffle.picked[name] = !state.shuffle.picked[name];
    state.shuffle.done = false;
    renderTeamsTab();
}
function shuffleClearPicks() {
    state.shuffle = { picked: {}, team1: [], team2: [], done: false, tol: state.shuffle.tol || 0.2 };
    renderTeamsTab();
}
function setShuffleTol(pct) { state.shuffle.tol = pct; renderTeamsTab(); }
// Point-aware split with a relaxation band: while the two teams stay within
// `tol` of each other (as a share of the total points in play) the side is
// picked at random, so most shuffles are genuinely random. Only once a pick
// would push the gap past the tolerance do we force the player onto the
// lighter team to pull things back. A looser tolerance = more random.
function shuffleMakeTeams() {
    const picked = state.data.roster.filter(p => state.shuffle.picked[p]);
    if (picked.length < 2) { toast('Pick at least two players first'); return; }
    const pts = seasonPointsByPlayer();
    const tol = state.shuffle.tol || 0.2;
    const rated = picked.map(p => ({ name: p, r: pts[p] || 0 }))
        .sort((a, b) => (b.r - a.r) || (Math.random() - 0.5));
    const grandTotal = rated.reduce((s, x) => s + x.r, 0);
    const allowed = tol * (grandTotal || 1); // max point gap we tolerate
    const half = Math.ceil(rated.length / 2);
    const t1 = [], t2 = [];
    let sum1 = 0, sum2 = 0;
    rated.forEach(x => {
        const room1 = t1.length < half, room2 = t2.length < half;
        let toOne;
        if (!room2) toOne = true;
        else if (!room1) toOne = false;
        else {
            const diffIf1 = Math.abs((sum1 + x.r) - sum2);
            const diffIf2 = Math.abs(sum1 - (sum2 + x.r));
            const ok1 = diffIf1 <= allowed, ok2 = diffIf2 <= allowed;
            if (ok1 && ok2) toOne = Math.random() < 0.5; // both within band -> random
            else if (ok1) toOne = true;
            else if (ok2) toOne = false;
            else toOne = diffIf1 <= diffIf2;             // both over -> least lopsided
        }
        if (toOne) { t1.push(x.name); sum1 += x.r; } else { t2.push(x.name); sum2 += x.r; }
    });
    state.shuffle.team1 = t1;
    state.shuffle.team2 = t2;
    state.shuffle.done = true;
    renderTeamsTab();
    toast('Teams made: ' + t1.length + ' vs ' + t2.length);
}
// Push the shuffled teams into the "Add a game day" form and jump there.
function shuffleUseForGameDay() {
    if (!state.shuffle.done) return;
    state.past.team = {};
    state.shuffle.team1.forEach(p => { state.past.team[p] = 'team1'; });
    state.shuffle.team2.forEach(p => { state.past.team[p] = 'team2'; });
    state.showPast = true;
    if (!state.past.date) state.past.date = new Date().toISOString().split('T')[0];
    switchTab('season');
    toast('Teams sent to the game day form');
}

/* ---------- 12-0 rounds: King Maker / Joker badges ----------
   Buffer shape per round: { winner: 'team1'|'team2', crossed: { name: true } }.
   ctx is 'past' (new day form) or 'edit' (edit-week form). */
function koBuf(ctx) { return ctx === 'past' ? state.past.ko : state.editBuf.ko; }
function addKoRound(ctx) { koBuf(ctx).push({ winner: 'team1', crossed: {} }); renderSeasonTab(); }
function removeKoRound(ctx, i) { koBuf(ctx).splice(i, 1); renderSeasonTab(); }
function setKoWinner(ctx, i, team) { const r = koBuf(ctx)[i]; r.winner = team; r.crossed = {}; renderSeasonTab(); }
function toggleKoCrossed(ctx, i, name) { const c = koBuf(ctx)[i].crossed; c[name] = !c[name]; renderSeasonTab(); }

// Convert the editor buffer into stored koRounds, keeping only crossed players
// who are actually on the losing team.
function koRoundsFromBuf(ctx, team1, team2) {
    return koBuf(ctx).map(r => {
        const losers = r.winner === 'team1' ? team2 : team1;
        const crossed = losers.filter(p => r.crossed[p]);
        return { winner: r.winner, crossed };
    });
}

function koEditorHtml(ctx, team1, team2) {
    const ko = koBuf(ctx);
    const rows = ko.map((r, i) => {
        const winTeam = r.winner === 'team1' ? team1 : team2;
        const loseTeam = r.winner === 'team1' ? team2 : team1;
        const jokers = loseTeam.length
            ? loseTeam.map(p => {
                const arg = jsArg(p);
                const on = !!r.crossed[p];
                return '<button class="chip-toggle' + (on ? ' on' : '') + '" onclick="toggleKoCrossed(\'' + ctx + '\',' + i + ',' + arg + ')">' + (on ? iconCrossed(true) : iconJoker('i-sm')) + esc(p) + '</button>';
            }).join('')
            : '<span class="meta">no players on the losing team</span>';
        return '<div class="ko-round">' +
            '<div class="ko-head"><strong>12-0 round ' + (i + 1) + '</strong>' +
            '<button class="btn danger small" onclick="removeKoRound(\'' + ctx + '\',' + i + ')">Remove</button></div>' +
            '<div class="seg2" style="margin:8px 0;">' +
            '<button class="' + (r.winner === 'team1' ? 'on-t1' : '') + '" onclick="setKoWinner(\'' + ctx + '\',' + i + ',\'team1\')">Team 1 won 12-0</button>' +
            '<button class="' + (r.winner === 'team2' ? 'on-t2' : '') + '" onclick="setKoWinner(\'' + ctx + '\',' + i + ',\'team2\')">Team 2 won 12-0</button>' +
            '</div>' +
            '<div class="hint">' + iconKing('i-sm') + ' King Maker: ' + (winTeam.length ? winTeam.map(esc).join(', ') : '—') + '</div>' +
            '<div class="hint" style="margin-top:6px;">' + iconJoker('i-sm') + ' Jokers</div>' +
            '<div class="ko-jokers">' + jokers + '</div>' +
            '</div>';
    }).join('');
    const canUse = team1.length && team2.length;
    return '<div style="margin-top:14px;">' +
        '<label>12-0 rounds (King Maker / Joker)</label>' +
        (canUse
            ? rows + '<button class="btn subtle" onclick="addKoRound(\'' + ctx + '\')">+ Add a 12-0 round</button>'
            : '<div class="meta">Assign both teams first to add 12-0 rounds.</div>') +
        '</div>';
}

function renumberSeason() {
    state.data.season.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    state.data.season.forEach((w, i) => { w.week = i + 1; });
}

function savePastDay() {
    if (!state.past.date) { toast('Pick a date first'); return; }
    const team1 = [], team2 = [];
    state.data.roster.forEach(p => {
        const t = state.past.team[p];
        if (t === 'team1') team1.push(p);
        else if (t === 'team2') team2.push(p);
    });
    if (!team1.length || !team2.length) { toast('Assign at least one player to each team'); return; }

    const s1 = parseFloat(state.past.score1), s2 = parseFloat(state.past.score2);
    const teamScores = { team1: isNaN(s1) ? 0 : s1, team2: isNaN(s2) ? 0 : s2 };

    // Everyone on a team gets that team's score for the week, unless an
    // individual override was entered for that player.
    const finalTally = {};
    team1.forEach(p => { const v = parseFloat(state.past.points[p]); finalTally[p] = isNaN(v) ? teamScores.team1 : v; });
    team2.forEach(p => { const v = parseFloat(state.past.points[p]); finalTally[p] = isNaN(v) ? teamScores.team2 : v; });

    const rounds = [];
    if (teamScores.team1 !== teamScores.team2) {
        const winner = teamScores.team1 > teamScores.team2 ? 'team1' : 'team2';
        rounds.push({ winner, winnerPlayers: (winner === 'team1' ? team1 : team2).slice() });
    }

    const koRounds = koRoundsFromBuf('past', team1, team2);

    const week = {
        id: genId(),
        week: state.data.season.length + 1,
        date: state.past.date, manual: true, completed: true,
        games: [], players: { team1, team2 }, teamScores, rounds, finalTally, koRounds
    };

    state.data.season.push(week);
    renumberSeason();
    state.past = { date: '', team: {}, score1: '', score2: '', points: {}, ko: [] };
    state.showPast = false;
    persist(); render();
    toast('Game day saved for ' + week.date);
}

/* ---------- edit a previous week's points ---------- */
function editWeekOpen(idx) {
    const w = state.data.season[idx];
    const ft = w.finalTally || {};
    const points = {};
    weekPlayers(w).forEach(p => {
        // For manual weeks, leave a player's box blank when their stored value is
        // just the team-score default, so editing the team score re-propagates.
        let show = (ft[p] !== undefined) ? String(ft[p]) : '';
        if (w.manual) {
            const teamScore = (w.players.team1 || []).includes(p) ? w.teamScores.team1 : w.teamScores.team2;
            if (ft[p] === teamScore) show = '';
        }
        points[p] = show;
    });
    // Load existing 12-0 rounds into the editor buffer (crossed array -> map).
    const ko = (w.koRounds || []).map(r => {
        const crossed = {};
        (r.crossed || []).forEach(p => { crossed[p] = true; });
        return { winner: r.winner, crossed };
    });
    state.editWeek = idx;
    state.editBuf = {
        score1: w.manual ? String(w.teamScores.team1) : '',
        score2: w.manual ? String(w.teamScores.team2) : '',
        points, ko
    };
    renderSeasonTab();
}
function editWeekCancel() { state.editWeek = null; state.editBuf = null; renderSeasonTab(); }
function setEditScore(which, v) { state.editBuf['score' + which] = v; }
function setEditPoints(name, v) { state.editBuf.points[name] = v; }
function editWeekSave() {
    const idx = state.editWeek;
    const w = state.data.season[idx];
    if (!w) { editWeekCancel(); return; }

    if (w.manual) {
        const s1 = parseFloat(state.editBuf.score1), s2 = parseFloat(state.editBuf.score2);
        w.teamScores = { team1: isNaN(s1) ? 0 : s1, team2: isNaN(s2) ? 0 : s2 };
        const ft = {};
        (w.players.team1 || []).forEach(p => { const v = parseFloat(state.editBuf.points[p]); ft[p] = isNaN(v) ? w.teamScores.team1 : v; });
        (w.players.team2 || []).forEach(p => { const v = parseFloat(state.editBuf.points[p]); ft[p] = isNaN(v) ? w.teamScores.team2 : v; });
        w.finalTally = ft;
        w.rounds = [];
        if (w.teamScores.team1 !== w.teamScores.team2) {
            const winner = w.teamScores.team1 > w.teamScores.team2 ? 'team1' : 'team2';
            w.rounds.push({ winner, winnerPlayers: (winner === 'team1' ? w.players.team1 : w.players.team2).slice() });
        }
    } else {
        const ft = {};
        weekPlayers(w).forEach(p => { const v = parseFloat(state.editBuf.points[p]); if (!isNaN(v)) ft[p] = v; });
        w.finalTally = ft;
    }

    w.koRounds = koRoundsFromBuf('edit', w.players.team1 || [], w.players.team2 || []);

    state.editWeek = null; state.editBuf = null;
    persist(); render();
    toast('Week ' + w.week + ' updated');
}

/* ---------- actions ---------- */
function switchTab(name) {
    state.activeTab = name;
    state.editWeek = null; state.editBuf = null;
    ['season','teams','roster','data'].forEach(t => {
        document.getElementById('tab-' + t).style.display = t === name ? 'block' : 'none';
    });
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    render();
    // Restart the panel's entrance animation on every switch.
    const panel = document.getElementById('tab-' + name);
    panel.classList.remove('tab-panel');
    void panel.offsetWidth;
    panel.classList.add('tab-panel');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setLbSort(mode) { state.lbSort = mode; renderSeasonTab(); }
function setLbView(mode) { state.lbView = mode; renderSeasonTab(); }

function exportData() {
    const json = JSON.stringify(state.data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'thuruppu-backup-' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
}
function importData(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            state.data = JSON.parse(e.target.result);
            if (!state.data.roster) state.data.roster = [];
            if (!state.data.guests) state.data.guests = [];
            ensureWeekIds();
            persist(); render();
            toast('Data imported');
        } catch (err) { toast('Import failed: invalid JSON'); }
    };
    reader.readAsText(file);
}
function copyJson() {
    navigator.clipboard.writeText(JSON.stringify(state.data, null, 2)).then(
        () => toast('Copied to clipboard'), () => toast('Copy not available'));
}

    }
    const pts = seasonPointsByPlayer();
    const pickedCount = state.data.roster.filter(p => state.shuffle.picked[p]).length;

    // Step 1 — pick who's playing today from the full pool.
    const pickList = '<div class="roster-list">' + state.data.roster.map(p => {
        const arg = jsArg(p);
        const on = !!state.shuffle.picked[p];
        return '<div class="roster-item' + (on ? ' picked' : '') + '">' +
            avatarHtml(p) +
            '<span class="rname">' + esc(p) + guestTag(p) +

    const curTol = state.shuffle.tol || 0.2;

        '<label>Balance tolerance</label>' +
        tolBtns +
        '<div class="meta" style="margin:10px 0;">' + pickedCount + ' picked</div>' +

        '<button class="btn green" style="margin-top:14px;" onclick="shuffleMakeTeams()">' + icon('shuffle') + 'Shuffle &amp; make teams</button>' +

        '</div>';

    if (state.shuffle.done) {

        const sum = arr => arr.reduce((s, p) => s + (pts[p] || 0), 0);

        html += '<div class="card"><h3>' + icon('users') + 'Teams</h3>' +

            '<div class="tplayers">' + playerChips(t1) + '</div></div>' +
            '<div class="vs">vs</div>' +
            '<div class="team t2"><div class="tlabel">Team 2</div>' +
            '<div class="tscore" style="color:var(--red)">' + round2(sum(t2)) + '</div>' +
            '<div class="tplayers">' + playerChips(t2) + '</div></div>' +
            '</div>' +
            '<div class="score-caption">Season points &middot; gap ' + gap + '</div>' +
            '<button class="btn green" style="margin-top:14px;" onclick="shuffleMakeTeams()">' + icon('refresh') + 'Shuffle again</button>' +
            '<button class="btn subtle" style="margin-top:8px;" onclick="shuffleUseForGameDay()">Use these teams for a game day</button>' +
