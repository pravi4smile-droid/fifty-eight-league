<html lang="en" data-theme="light">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="description" content="Fifty Eight League — Thuruppu weekly score tracker">
<title>Fifty Eight League</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e3a5f'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='30' font-weight='bold' fill='%23fff' text-anchor='middle'%3E58%3C/text%3E%3C/svg%3E">
<script>
/* Resolve the theme before first paint so there is no flash. */
(function () {
    var pref = 'auto';
    try { pref = localStorage.getItem('thuruppu-theme') || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' &&
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.themePref = pref;
})();
</script>
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root {
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --num: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
    --maxw: 640px;
    --r-xl: 22px; --r-lg: 18px; --r: 14px; --r-sm: 10px; --r-xs: 8px;
    --tap: 44px;
    --ease: cubic-bezier(.2,.7,.3,1);
}
:root[data-theme="light"] {
    color-scheme: light;
    --bg: #eaeff7;
    --bg-a: #e3ebf6; --bg-b: #f5f8fc;
    --card: #ffffff; --card-2: #f6f8fc; --field: #f5f7fb;
    --text: #0f172a; --text-2: #334155; --muted: #6b7280;
    --border: #e3e9f1; --border-2: #eef2f7;
    --primary: #1e3a5f; --strong: #22456f; --strong-2: #35699f; --strong-fg: #ffffff;
    --blue: #2563eb; --red: #e11d48; --green: #16a34a; --accent: #e07c12;
    --violet: #6d28d9; --gold: #e0a80b;
    --tint-blue: #e8f0fe; --tint-red: #fdeaef; --tint-green: #e6f7ee;
    --tint-amber: #fff3e0; --tint-violet: #efe9fb; --tint-neutral: #eef1f7;
    --on-blue: #1d4ed8; --on-red: #be123c; --on-green: #15803d;
    --on-amber: #b45309; --on-violet: #6d28d9;
    --sorted-bg: #f1f6fd;
    --chart-plot: #f7f9fc; --chart-stripe: #0b1220; --chart-stripe-op: .035;
    --hdr-1: #16304f; --hdr-2: #24507f; --hdr-3: #3a76b0;
    --sh-sm: 0 1px 2px rgba(15,23,42,.05), 0 2px 6px rgba(15,23,42,.05);
    --sh-md: 0 6px 20px rgba(15,23,42,.08);
    --sh-lg: 0 16px 40px rgba(15,23,42,.16);
    --glass: rgba(255,255,255,.86);
    --scrim: rgba(15,23,42,.45);
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0f1d;
    --bg-a: #0d152a; --bg-b: #080d19;
    --card: #141b2e; --card-2: #1a2237; --field: #1a2237;
    --text: #e9edf6; --text-2: #c4ccdd; --muted: #8d99b2;
    --border: #263048; --border-2: #1f2740;
    --primary: #8ab4f8; --strong: #2c5c96; --strong-2: #4485d1; --strong-fg: #ffffff;
    --blue: #60a5fa; --red: #fb7185; --green: #4ade80; --accent: #fbbf24;
    --violet: #a78bfa; --gold: #fbbf24;
    --tint-blue: #16294a; --tint-red: #3b1526; --tint-green: #0f2f23;
    --tint-amber: #382a11; --tint-violet: #251b46; --tint-neutral: #1d2438;
    --on-blue: #93c5fd; --on-red: #fda4af; --on-green: #86efac;
    --on-amber: #fcd34d; --on-violet: #c4b5fd;
    --sorted-bg: #1a2540;
    --chart-plot: #101728; --chart-stripe: #ffffff; --chart-stripe-op: .05;
    --hdr-1: #101c33; --hdr-2: #1a3860; --hdr-3: #245288;
    --sh-sm: 0 1px 2px rgba(0,0,0,.4);
    --sh-md: 0 8px 24px rgba(0,0,0,.45);
    --sh-lg: 0 18px 44px rgba(0,0,0,.6);
    --glass: rgba(20,27,46,.86);
    --scrim: rgba(0,0,0,.6);
}

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
    font-family: var(--font);
    background: var(--bg);
    background-image: radial-gradient(1200px 600px at 50% -10%, var(--bg-a), transparent 70%),
                      linear-gradient(180deg, var(--bg-b), var(--bg) 40%);
    background-attachment: fixed;
    margin: 0; color: var(--text);
    font-size: 15px; line-height: 1.45;
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
}
.container {
    max-width: var(--maxw); margin: 0 auto;
    padding: 0 max(12px, env(safe-area-inset-left)) 12px max(12px, env(safe-area-inset-right));
}
.hero-inner {
    position: relative; z-index: 1;
    max-width: var(--maxw); margin: 0 auto;
    padding: 0 max(4px, env(safe-area-inset-left)) 0 max(4px, env(safe-area-inset-right));
}
::selection { background: var(--tint-blue); }

/* ============================================================
   Header
   ============================================================ */
.hero {
    position: relative; overflow: hidden;
    margin: 0 0 14px; padding: calc(14px + env(safe-area-inset-top)) 12px 16px;
    border-radius: 0 0 var(--r-xl) var(--r-xl);
    background: linear-gradient(135deg, var(--hdr-1), var(--hdr-2) 55%, var(--hdr-3));
    color: #fff; box-shadow: var(--sh-md);
}
.hero::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
        radial-gradient(220px 120px at 88% -20%, rgba(255,255,255,.22), transparent 70%),
        radial-gradient(180px 140px at 8% 120%, rgba(255,255,255,.10), transparent 70%);
}
.hero-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; }
.brand-mark {
    width: 42px; height: 42px; flex-shrink: 0; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--num); font-weight: 800; font-size: 17px; letter-spacing: -.5px;
    background: linear-gradient(160deg, rgba(255,255,255,.30), rgba(255,255,255,.10));
    border: 1px solid rgba(255,255,255,.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
}
.brand-text { min-width: 0; flex: 1; }
.brand-text h1 {
    margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-text p { margin: 1px 0 0; font-size: 11.5px; opacity: .72; font-weight: 500; }
.hero-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
    width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.20);
    color: #fff; font-size: 16px; cursor: pointer; transition: transform .15s var(--ease), background .2s;
}
.icon-btn:active { transform: scale(.9); background: rgba(255,255,255,.26); }
.sync-status {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: .2px;
    padding: 5px 11px 5px 9px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18);
}
.sync-status .dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }
.sync-status.online { background: rgba(34,197,94,.24); border-color: rgba(134,239,172,.35); }
.sync-status.online .dot { background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.7); animation: pulse 2.4s infinite; }
.sync-status.offline { background: rgba(245,158,11,.26); border-color: rgba(253,224,71,.35); }
.sync-status.offline .dot { background: #fbbf24; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); } 70% { box-shadow: 0 0 0 7px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }

/* ============================================================
   Tab bar
   ============================================================ */
.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    display: flex; gap: 2px; max-width: var(--maxw); margin: 0 auto;
    padding: 6px max(6px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-right));
    background: var(--glass);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    backdrop-filter: saturate(180%) blur(18px);
    border-top: 1px solid var(--border);
    box-shadow: 0 -6px 24px rgba(15,23,42,.07);
}
.tabbar button {
    position: relative; flex: 1; min-height: var(--tap);
    background: none; border: none; border-radius: var(--r);
    padding: 7px 2px 6px; font-family: inherit;
    font-size: 10.5px; font-weight: 700; letter-spacing: .1px;
    color: var(--muted); cursor: pointer;
    transition: color .2s, background .2s, transform .15s var(--ease);
}
.tabbar button .ico { display: block; font-size: 19px; line-height: 1.15; margin-bottom: 2px; transition: transform .25s var(--ease); }
.tabbar button:active { transform: scale(.94); }
.tabbar button.active { color: var(--primary); background: var(--tint-neutral); }
.tabbar button.active .ico { transform: translateY(-1px) scale(1.1); }
.tabbar button.active::before {
    content: ''; position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
    width: 20px; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, var(--strong), var(--strong-2));
}

/* ============================================================
   Cards & typography
   ============================================================ */
.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px;
    box-shadow: var(--sh-sm);
}
.card h3 {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 13px; font-size: 15px; font-weight: 800; letter-spacing: -.2px; color: var(--text);
}
.card h3::before {
    content: ''; width: 4px; height: 15px; border-radius: 3px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--strong-2), var(--strong));
}
label {
    display: block; font-size: 11px; font-weight: 700; margin-bottom: 6px;
    color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
}
.meta { font-size: 12.5px; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty .big { font-size: 40px; margin-bottom: 10px; opacity: .85; }

.tab-panel { animation: riseIn .34s var(--ease) both; }
@keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ============================================================
   Form controls
   ============================================================ */
input, select, textarea {
    width: 100%; padding: 12px; font-family: inherit;
    border: 1.5px solid var(--border); border-radius: var(--r-sm);
    font-size: 16px; /* 16px keeps iOS from zooming on focus */
    background: var(--field); color: var(--text);
    transition: border-color .18s, background .18s, box-shadow .18s;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--strong-2); background: var(--card);
    box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--strong-2) 18%, transparent);
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg2 button {
    min-height: 42px; padding: 10px 4px; font-family: inherit;
    border: 1.5px solid var(--border); border-radius: var(--r-sm);
    background: var(--field); color: var(--muted);
    font-weight: 700; font-size: 13.5px; cursor: pointer;
    transition: all .18s var(--ease);
}
.seg2 button:active { transform: scale(.97); }
.seg2 button.on-t1 { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 3px 10px color-mix(in srgb, var(--blue) 35%, transparent); }
.seg2 button.on-t2 { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 3px 10px color-mix(in srgb, var(--red) 35%, transparent); }
.seg2 button.on-made { background: var(--green); color: #fff; border-color: var(--green); }
.seg2 button.on-lost { background: var(--red); color: #fff; border-color: var(--red); }

.btn {
    width: 100%; min-height: var(--tap); padding: 13px; font-family: inherit;
    border: none; border-radius: var(--r);
    background: linear-gradient(135deg, var(--strong), var(--strong-2));
    color: var(--strong-fg); font-size: 15px; font-weight: 800; letter-spacing: .1px;
    cursor: pointer; box-shadow: var(--sh-sm);
    transition: transform .14s var(--ease), box-shadow .18s, filter .18s;
}
.btn:active { transform: scale(.975); filter: brightness(1.06); }
.btn.green { background: linear-gradient(135deg, #15803d, #22c55e); }
.btn.blue { background: linear-gradient(135deg, #1d4ed8, #3b82f6); }
.btn.danger { background: linear-gradient(135deg, #be123c, #f43f5e); }
.btn.subtle {
    background: var(--tint-neutral); color: var(--primary);
    border: 1.5px solid var(--border); box-shadow: none;
}
.btn.small { width: auto; min-height: 34px; padding: 7px 13px; font-size: 12px; border-radius: var(--r-sm); }

.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; }
.add-row button { width: auto; padding: 0 20px; flex-shrink: 0; }

.chip-toggle {
    display: inline-flex; align-items: center; gap: 5px; min-height: 36px;
    padding: 7px 13px; border-radius: 999px; font-family: inherit;
    border: 1.5px solid var(--border); background: var(--card);
    font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
    transition: all .18s var(--ease);
}
.chip-toggle:active { transform: scale(.96); }
.chip-toggle.on { background: var(--tint-green); border-color: var(--green); color: var(--on-green); }

/* ============================================================
   Avatars
   ============================================================ */
.avi {
    width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--num); font-size: 11.5px; font-weight: 800; color: #fff;
    letter-spacing: -.2px; box-shadow: var(--sh-sm);
}
.avi.sm { width: 25px; height: 25px; border-radius: 8px; font-size: 10px; }
.avi.lg { width: 54px; height: 54px; border-radius: 18px; font-size: 19px; }

/* ============================================================
   Roster list
   ============================================================ */
.roster-list { display: flex; flex-direction: column; }
.roster-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 0; border-bottom: 1px solid var(--border-2);
}
.roster-item:last-child { border-bottom: none; }
.roster-item.picked { background: color-mix(in srgb, var(--tint-green) 70%, transparent); border-radius: var(--r-sm); padding-left: 8px; padding-right: 8px; margin: 0 -8px; border-bottom-color: transparent; }
.roster-item .lb-sub { margin-left: auto; padding-right: 4px; }
.roster-item .rname {
    flex: 1; min-width: 0; font-weight: 650; font-size: 14.5px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.guest-tag {
    font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
    background: var(--tint-amber); color: var(--on-amber);
    padding: 2px 7px; border-radius: 999px; flex-shrink: 0;
}
.mini-toggle {
    min-height: 32px; padding: 5px 12px; font-family: inherit;
    border: 1.5px solid var(--border); border-radius: 999px;
    background: var(--field); font-size: 11.5px; font-weight: 700;
    color: var(--muted); cursor: pointer; flex-shrink: 0;
    transition: all .18s var(--ease);
}
.mini-toggle:active { transform: scale(.95); }
.mini-toggle.on { background: var(--tint-amber); border-color: var(--accent); color: var(--on-amber); }
.mini-toggle.go.on { background: var(--tint-green); border-color: var(--green); color: var(--on-green); }
.mini-toggle.sel.on { background: linear-gradient(135deg, var(--strong), var(--strong-2)); border-color: transparent; color: var(--strong-fg); }
.mini-btn {
    width: 34px; height: 34px; flex-shrink: 0; font-family: inherit;
    border: 1.5px solid var(--border); border-radius: var(--r-sm);
    background: var(--field); cursor: pointer; font-size: 15px; color: var(--blue);
    transition: all .18s var(--ease);
}
.mini-btn:active { transform: scale(.92); }
.mini-btn.danger { color: var(--red); font-weight: 800; }
.guest-check {
    display: inline-flex; align-items: center; gap: 9px; margin-top: 12px;
    font-size: 13.5px; font-weight: 650; color: var(--text);
    text-transform: none; letter-spacing: 0; cursor: pointer;
}
.guest-check .box {
    width: 22px; height: 22px; border: 1.5px solid var(--border); border-radius: 7px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; transition: all .18s var(--ease);
}
.guest-check .box.on { background: var(--accent); border-color: var(--accent); }

/* ============================================================
   Badges
   ============================================================ */
.badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px;
    font-size: 10.5px; font-weight: 800; letter-spacing: .3px;
    margin: 2px 4px 2px 0; background: var(--tint-neutral); color: var(--muted);
}
.badge.made { background: var(--tint-green); color: var(--on-green); }
.badge.lost { background: var(--tint-red); color: var(--on-red); }
.badge.thani { background: var(--tint-amber); color: var(--on-amber); }
.badge.manual { background: var(--tint-violet); color: var(--on-violet); }

/* ============================================================
   Podium (season leaders)
   ============================================================ */
.podium {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 16px 14px 14px; margin-bottom: 12px;
    box-shadow: var(--sh-sm);
}
.podium::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(320px 150px at 50% -30%, color-mix(in srgb, var(--gold) 22%, transparent), transparent 72%);
}
.podium-title {
    position: relative; text-align: center; font-size: 10.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin-bottom: 14px;
}
.podium-row { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 8px; }
.pod { flex: 1; max-width: 120px; text-align: center; }
.pod .crown { font-size: 19px; line-height: 1; margin-bottom: 3px; }
.pod .avi { margin: 0 auto 7px; }
.pod .pname {
    font-size: 12.5px; font-weight: 750; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pod .ppts { font-family: var(--num); font-size: 17px; font-weight: 850; letter-spacing: -.4px; margin-top: 1px; }
.pod .psub { font-size: 10.5px; color: var(--muted); font-weight: 600; }
.pod .plinth {
    margin-top: 8px; border-radius: 12px 12px 6px 6px;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 6px; font-family: var(--num); font-weight: 850; font-size: 14px;
}
.pod.p1 .plinth { height: 54px; background: linear-gradient(180deg, #fbe38b, #e0a80b); color: #6a4a04; }
.pod.p2 .plinth { height: 40px; background: linear-gradient(180deg, #e8ecf2, #b9c2ce); color: #4a5361; }
.pod.p3 .plinth { height: 32px; background: linear-gradient(180deg, #f0c49a, #cd8f56); color: #63380f; }
.pod.p1 .avi { width: 54px; height: 54px; border-radius: 18px; font-size: 19px; box-shadow: 0 6px 18px color-mix(in srgb, var(--gold) 45%, transparent); }
.pod.p1 .ppts { font-size: 20px; }

/* Legacy single-leader banner (kept for compatibility) */
.winner-banner {
    background: linear-gradient(120deg, var(--tint-amber), var(--card));
    border: 1px solid color-mix(in srgb, var(--gold) 35%, var(--border));
    border-radius: var(--r-lg); padding: 14px; text-align: center; margin-bottom: 12px;
}
.winner-banner .wt { font-size: 11px; color: var(--on-amber); font-weight: 800; text-transform: uppercase; letter-spacing: .6px; }
.winner-banner .wn { font-size: 20px; font-weight: 850; color: var(--text); margin-top: 4px; }

/* ============================================================
   Stat tiles
   ============================================================ */
/* auto-fit sizes off the real container width, so this reflows on any screen */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat-tile {
    background: var(--card-2); border: 1px solid var(--border-2);
    border-radius: var(--r); padding: 12px 13px;
}
.stat-tile .sv {
    font-family: var(--num); font-size: 23px; font-weight: 850;

/* ---------- Teams tab: balanced random shuffle ----------
   Pick who's playing today, then split into two teams weighted by each
   player's season points so the strongest players don't stack on one side. */
function seasonPointsByPlayer() {
    const pts = {};
    (state.data.season || []).forEach(w => {
        if (w.finalTally) Object.entries(w.finalTally).forEach(([p, v]) => {
            pts[p] = (pts[p] || 0) + (Number(v) || 0);
        });
    });
    return pts;
}
function toggleShufflePick(name) {
    state.shuffle.picked[name] = !state.shuffle.picked[name];
    state.shuffle.done = false;
    renderTeamsTab();
}
function shuffleClearPicks() {
    state.shuffle = { picked: {}, team1: [], team2: [], done: false, tol: state.shuffle.tol || 0.2 };
    renderTeamsTab();
}
function setShuffleTol(pct) { state.shuffle.tol = pct; renderTeamsTab(); }
// Point-aware split with a relaxation band: while the two teams stay within
// `tol` of each other (as a share of the total points in play) the side is
// picked at random, so most shuffles are genuinely random. Only once a pick
// would push the gap past the tolerance do we force the player onto the
// lighter team to pull things back. A looser tolerance = more random.
function shuffleMakeTeams() {
    const picked = state.data.roster.filter(p => state.shuffle.picked[p]);
    if (picked.length < 2) { toast('Pick at least two players first'); return; }
    const pts = seasonPointsByPlayer();
    const tol = state.shuffle.tol || 0.2;
    const rated = picked.map(p => ({ name: p, r: pts[p] || 0 }))
        .sort((a, b) => (b.r - a.r) || (Math.random() - 0.5));
    const grandTotal = rated.reduce((s, x) => s + x.r, 0);
    const allowed = tol * (grandTotal || 1); // max point gap we tolerate
    const half = Math.ceil(rated.length / 2);
    const t1 = [], t2 = [];
    let sum1 = 0, sum2 = 0;
    rated.forEach(x => {
        const room1 = t1.length < half, room2 = t2.length < half;
        let toOne;
        if (!room2) toOne = true;
        else if (!room1) toOne = false;
        else {
            const diffIf1 = Math.abs((sum1 + x.r) - sum2);
            const diffIf2 = Math.abs(sum1 - (sum2 + x.r));
            const ok1 = diffIf1 <= allowed, ok2 = diffIf2 <= allowed;
            if (ok1 && ok2) toOne = Math.random() < 0.5; // both within band -> random
            else if (ok1) toOne = true;
            else if (ok2) toOne = false;
            else toOne = diffIf1 <= diffIf2;             // both over -> least lopsided
        }
        if (toOne) { t1.push(x.name); sum1 += x.r; } else { t2.push(x.name); sum2 += x.r; }
    });
    state.shuffle.team1 = t1;
    state.shuffle.team2 = t2;
    state.shuffle.done = true;
    renderTeamsTab();
    toast('Teams made: ' + t1.length + ' vs ' + t2.length);
}
// Push the shuffled teams into the "Add a game day" form and jump there.
function shuffleUseForGameDay() {
    if (!state.shuffle.done) return;
    state.past.team = {};
    state.shuffle.team1.forEach(p => { state.past.team[p] = 'team1'; });
    state.shuffle.team2.forEach(p => { state.past.team[p] = 'team2'; });
    state.showPast = true;
    if (!state.past.date) state.past.date = new Date().toISOString().split('T')[0];
    switchTab('season');
    toast('Teams sent to the game day form');
}

/* ---------- 12-0 rounds: King Maker / Joker badges ----------
   Buffer shape per round: { winner: 'team1'|'team2', crossed: { name: true } }.
   ctx is 'past' (new day form) or 'edit' (edit-week form). */
function koBuf(ctx) { return ctx === 'past' ? state.past.ko : state.editBuf.ko; }
function addKoRound(ctx) { koBuf(ctx).push({ winner: 'team1', crossed: {} }); renderSeasonTab(); }
function removeKoRound(ctx, i) { koBuf(ctx).splice(i, 1); renderSeasonTab(); }
function setKoWinner(ctx, i, team) { const r = koBuf(ctx)[i]; r.winner = team; r.crossed = {}; renderSeasonTab(); }
function toggleKoCrossed(ctx, i, name) { const c = koBuf(ctx)[i].crossed; c[name] = !c[name]; renderSeasonTab(); }

// Convert the editor buffer into stored koRounds, keeping only crossed players
// who are actually on the losing team.
function koRoundsFromBuf(ctx, team1, team2) {
    return koBuf(ctx).map(r => {
        const losers = r.winner === 'team1' ? team2 : team1;
        const crossed = losers.filter(p => r.crossed[p]);
        return { winner: r.winner, crossed };
    });
}

function koEditorHtml(ctx, team1, team2) {
    const ko = koBuf(ctx);
    const rows = ko.map((r, i) => {
        const winTeam = r.winner === 'team1' ? team1 : team2;
        const loseTeam = r.winner === 'team1' ? team2 : team1;
        const jokers = loseTeam.length
            ? loseTeam.map(p => {
                const arg = jsArg(p);
                const on = !!r.crossed[p];
                return '<button class="chip-toggle' + (on ? ' on' : '') + '" onclick="toggleKoCrossed(\'' + ctx + '\',' + i + ',' + arg + ')">' + (on ? iconCrossed(true) : ICON_JOKER.replace('ic ic-joker', 'ic ic-sm ic-joker')) + esc(p) + '</button>';
            }).join('')
            : '<span class="meta">no players on the losing team</span>';
        return '<div class="ko-round">' +
            '<div class="ko-head"><strong>12-0 round ' + (i + 1) + '</strong>' +
            '<button class="btn danger small" onclick="removeKoRound(\'' + ctx + '\',' + i + ')">Remove</button></div>' +
            '<div class="seg2" style="margin:8px 0;">' +
            '<button class="' + (r.winner === 'team1' ? 'on-t1' : '') + '" onclick="setKoWinner(\'' + ctx + '\',' + i + ',\'team1\')">Team 1 won 12-0</button>' +
            '<button class="' + (r.winner === 'team2' ? 'on-t2' : '') + '" onclick="setKoWinner(\'' + ctx + '\',' + i + ',\'team2\')">Team 2 won 12-0</button>' +
            '</div>' +
            '<div class="hint">' + ICON_KING.replace('ic ic-king', 'ic ic-sm ic-king') + ' King Maker (+2 each): ' + (winTeam.length ? winTeam.map(esc).join(', ') : '—') + '</div>' +
            '<div class="hint" style="margin-top:6px;">' + ICON_JOKER.replace('ic ic-joker', 'ic ic-sm ic-joker') + ' Jokers &mdash; tap anyone who lifted theirs:</div>' +
            '<div class="ko-jokers">' + jokers + '</div>' +
            '</div>';
    }).join('');
    const canUse = team1.length && team2.length;
    return '<div style="margin-top:14px;">' +
        '<label>12-0 rounds (King Maker / Joker)</label>' +
        '<div class="hint" style="margin-bottom:8px;">Add a round here <strong>only if it ended 12-0</strong>. The winning team each get a King Maker badge; the losers each get a Joker &mdash; tap any loser who lifted theirs. Add one per 12-0 round (a week can have several).</div>' +
        (canUse
            ? rows + '<button class="btn subtle" onclick="addKoRound(\'' + ctx + '\')">+ Add a 12-0 round</button>'
            : '<div class="meta">Assign both teams first to add 12-0 rounds.</div>') +
        '</div>';
}

function renumberSeason() {
    state.data.season.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    state.data.season.forEach((w, i) => { w.week = i + 1; });
}

function savePastDay() {
    if (!state.past.date) { toast('Pick a date first'); return; }
    const team1 = [], team2 = [];
    state.data.roster.forEach(p => {
        const t = state.past.team[p];
        if (t === 'team1') team1.push(p);
        else if (t === 'team2') team2.push(p);
    });
    if (!team1.length || !team2.length) { toast('Assign at least one player to each team'); return; }

    const s1 = parseFloat(state.past.score1), s2 = parseFloat(state.past.score2);
    const teamScores = { team1: isNaN(s1) ? 0 : s1, team2: isNaN(s2) ? 0 : s2 };

    // Everyone on a team gets that team's score for the week, unless an
    // individual override was entered for that player.
    const finalTally = {};
    team1.forEach(p => { const v = parseFloat(state.past.points[p]); finalTally[p] = isNaN(v) ? teamScores.team1 : v; });
    team2.forEach(p => { const v = parseFloat(state.past.points[p]); finalTally[p] = isNaN(v) ? teamScores.team2 : v; });

    const rounds = [];
    if (teamScores.team1 !== teamScores.team2) {
        const winner = teamScores.team1 > teamScores.team2 ? 'team1' : 'team2';
        rounds.push({ winner, winnerPlayers: (winner === 'team1' ? team1 : team2).slice() });
    }

    const koRounds = koRoundsFromBuf('past', team1, team2);

    const week = {
        id: genId(),
        week: state.data.season.length + 1,
        date: state.past.date, manual: true, completed: true,
        games: [], players: { team1, team2 }, teamScores, rounds, finalTally, koRounds
    };

    state.data.season.push(week);
    renumberSeason();
    state.past = { date: '', team: {}, score1: '', score2: '', points: {}, ko: [] };
    state.showPast = false;
    persist(); render();
    toast('Game day saved for ' + week.date);
}

/* ---------- edit a previous week's points ---------- */
function editWeekOpen(idx) {
    const w = state.data.season[idx];
    const ft = w.finalTally || {};
    const points = {};
    weekPlayers(w).forEach(p => {
        // For manual weeks, leave a player's box blank when their stored value is
        // just the team-score default, so editing the team score re-propagates.
        let show = (ft[p] !== undefined) ? String(ft[p]) : '';
        if (w.manual) {
            const teamScore = (w.players.team1 || []).includes(p) ? w.teamScores.team1 : w.teamScores.team2;
            if (ft[p] === teamScore) show = '';
        }
        points[p] = show;
    });
    // Load existing 12-0 rounds into the editor buffer (crossed array -> map).
    const ko = (w.koRounds || []).map(r => {
        const crossed = {};
        (r.crossed || []).forEach(p => { crossed[p] = true; });
        return { winner: r.winner, crossed };
    });
    state.editWeek = idx;
    state.editBuf = {
        score1: w.manual ? String(w.teamScores.team1) : '',
        score2: w.manual ? String(w.teamScores.team2) : '',
        points, ko
    };
    renderSeasonTab();
}

function setEditScore(which, v) { state.editBuf['score' + which] = v; }

function editWeekSave() {

    if (!w) { editWeekCancel(); return; }

    if (w.manual) {
        const s1 = parseFloat(state.editBuf.score1), s2 = parseFloat(state.editBuf.score2);
        w.teamScores = { team1: isNaN(s1) ? 0 : s1, team2: isNaN(s2) ? 0 : s2 };
        const ft = {};
        (w.players.team1 || []).forEach(p => { const v = parseFloat(state.editBuf.points[p]); ft[p] = isNaN(v) ? w.teamScores.team1 : v; });
        (w.players.team2 || []).forEach(p => { const v = parseFloat(state.editBuf.points[p]); ft[p] = isNaN(v) ? w.teamScores.team2 : v; });
        w.finalTally = ft;
        w.rounds = [];
        if (w.teamScores.team1 !== w.teamScores.team2) {
            const winner = w.teamScores.team1 > w.teamScores.team2 ? 'team1' : 'team2';
            w.rounds.push({ winner, winnerPlayers: (winner === 'team1' ? w.players.team1 : w.players.team2).slice() });
        }
    } else {
        const ft = {};
        weekPlayers(w).forEach(p => { const v = parseFloat(state.editBuf.points[p]); if (!isNaN(v)) ft[p] = v; });
        w.finalTally = ft;
    }

    w.koRounds = koRoundsFromBuf('edit', w.players.team1 || [], w.players.team2 || []);

function weekPlayers(week) {
    const set = new Set();
    (week.players ? week.players.team1.concat(week.players.team2) : []).forEach(p => set.add(p));
    week.games.forEach(g => { g.team1.concat(g.team2).forEach(p => set.add(p)); });
    return Array.from(set);
}

/* ---------- Position chart (bump chart of rank over weeks) ---------- */
function toggleChartHighlight(name) {
    state.lbHighlight = state.lbHighlight === name ? null : name;
    renderSeasonTab();
}
// Standing after each week: cumulative points so far, ranked 1..k among the
// players who have appeared by then.
function rankByWeek(season, names) {
    const cum = {}; names.forEach(n => { cum[n] = 0; });
    const seen = {};
    return season.map(w => {
        weekPlayers(w).forEach(p => { if (cum[p] !== undefined) seen[p] = true; });
        if (w.finalTally) Object.entries(w.finalTally).forEach(([p, v]) => { if (cum[p] !== undefined) cum[p] += Number(v) || 0; });
        const active = names.filter(n => seen[n]).sort((a, b) => (cum[b] - cum[a]) || a.localeCompare(b));
        const ranks = {}; active.forEach((n, i) => { ranks[n] = i + 1; });
        return { ranks: ranks, points: Object.assign({}, cum) };
    });
}
// Catmull-Rom spline through every rank node, emitted as cubic beziers so the
// line stays smooth but still passes exactly through each week's rank.
function smoothPath(p, clampLo, clampHi) {
    if (p.length === 1) return '';
    if (p.length === 2) return 'M' + p[0].x + ' ' + p[0].y + ' L' + p[1].x + ' ' + p[1].y;
    const t = 0.82, r1 = v => Math.round(v * 10) / 10;
    const cy = v => Math.max(clampLo, Math.min(clampHi, v));
    let d = 'M' + p[0].x + ' ' + p[0].y;
    for (let i = 0; i < p.length - 1; i++) {
        const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
        const c1x = p1.x + (p2.x - p0.x) / 6 * t, c1y = cy(p1.y + (p2.y - p0.y) / 6 * t);
        const c2x = p2.x - (p3.x - p1.x) / 6 * t, c2y = cy(p2.y - (p3.y - p1.y) / 6 * t);
        d += ' C' + r1(c1x) + ' ' + r1(c1y) + ' ' + r1(c2x) + ' ' + r1(c2y) + ' ' + p2.x + ' ' + p2.y;
    }
    return d;
}
function bumpChartHtml(season, leaderboard) {
    const names = leaderboard.map(p => p.name);
    if (season.length < 1 || names.length < 2) {
        return '<div class="hint" style="margin-top:8px;">Need at least two players and one recorded week to chart positions.</div>';
    }
    const series = rankByWeek(season, names);
    const maxRank = names.length;
    // Validated categorical slots (dataviz palette); players past the 8th recede
    // to a muted "other" gray so the leaders stay legible.
    const PAL = ['#2a78d6', '#1baf7a', '#eda100', '#008300', '#4a3aa7', '#e34948', '#e87ba4', '#eb6834'];
    const colored = idx => idx < PAL.length;
    const colorFor = idx => colored(idx) ? PAL[idx] : '#c2c6cc';
    const medal = ['🥇', '🥈', '🥉'];
    const hl = state.lbHighlight;

    const rowH = 34, topM = 30, botM = 40, leftM = 32;
    const maxNameLen = names.reduce((m, n) => Math.max(m, n.length), 0);
    const rightM = Math.min(190, Math.max(90, maxNameLen * 7.0 + 46));
    const xStep = Math.max(64, Math.min(122, season.length > 1 ? 430 / (season.length - 1) : 430));
    const X = wi => leftM + wi * xStep;
    const Y = rank => topM + (rank - 1) * rowH;
    const W = Math.round(leftM + (season.length - 1) * xStep + rightM);
    const H = topM + (maxRank - 1) * rowH + botM;
    const plotX0 = leftM - 12, plotX1 = X(season.length - 1) + 12;
    const plotY0 = topM - 15, plotY1 = Y(maxRank) + 15;
    const clampLo = topM - rowH * 0.4, clampHi = Y(maxRank) + rowH * 0.4;

    let svg = '<svg class="bump-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Player rank by week">';
    svg += '<defs><filter id="bumpSh" x="-20%" y="-25%" width="140%" height="150%">' +
        '<feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#0b1220" flood-opacity="0.22"/></filter></defs>';

    // Plot surface + alternating row stripes, with the leader row tinted gold.
    svg += '<rect class="bump-plot" x="' + plotX0 + '" y="' + plotY0 + '" width="' + (plotX1 - plotX0) +
        '" height="' + (plotY1 - plotY0) + '" rx="12"/>';
    for (let r = 1; r <= maxRank; r++) {
        const y = Y(r);
        if (r === 1) svg += '<rect class="bump-lead" x="' + plotX0 + '" y="' + (y - rowH / 2) + '" width="' + (plotX1 - plotX0) + '" height="' + rowH + '" opacity="0.10"/>';
        else if (r % 2 === 0) svg += '<rect class="bump-stripe" x="' + plotX0 + '" y="' + (y - rowH / 2) + '" width="' + (plotX1 - plotX0) + '" height="' + rowH + '" opacity="0.03"/>';
        svg += '<line class="bump-grid" x1="' + plotX0 + '" y1="' + y + '" x2="' + plotX1 + '" y2="' + y + '"/>';
        svg += '<text class="bump-rank" x="' + (leftM - 12) + '" y="' + (y + 4) + '" text-anchor="end">' + r + '</text>';
    }
    // Week columns: light vertical guides + week number and date.
    season.forEach((w, wi) => {
        const x = X(wi);
        svg += '<line class="bump-vgrid" x1="' + x + '" y1="' + plotY0 + '" x2="' + x + '" y2="' + plotY1 + '"/>';
        svg += '<text class="bump-wk" x="' + x + '" y="' + (H - 20) + '" text-anchor="middle">W' + w.week + '</text>';
        const md = (w.date || '').slice(5).replace('-', '/');
        if (md) svg += '<text class="bump-date" x="' + x + '" y="' + (H - 7) + '" text-anchor="middle">' + md + '</text>';
    });

    // Draw non-highlighted first, highlighted last so it sits on top.
    const order = leaderboard.map((p, idx) => ({ p: p, idx: idx })).sort((a, b) => (hl === a.p.name ? 1 : 0) - (hl === b.p.name ? 1 : 0));
    order.forEach(({ p, idx }) => {
        const pts = [];
        series.forEach((wk, wi) => {
            const r = wk.ranks[p.name];
            if (r) pts.push({ x: X(wi), y: Y(r), r: r, wi: wi, cp: wk.points[p.name] });
        });
        if (!pts.length) return;
        const col = colorFor(idx);
        const isHl = hl === p.name;
        const dim = hl && !isHl;
        const op = dim ? 0.14 : 1;
        const sw = isHl ? 4 : (colored(idx) ? 2.6 : 1.8);
        const arg = "'" + esc(p.name).replace(/'/g, "\\'") + "'";

        if (pts.length > 1) {
            svg += '<path class="bump-path" d="' + smoothPath(pts, clampLo, clampHi) + '" stroke="' + col +
                '" stroke-width="' + sw + '" opacity="' + op + '"' + (isHl ? ' filter="url(#bumpSh)"' : '') +
                ' onclick="toggleChartHighlight(' + arg + ')"/>';
        }
        pts.forEach((pt, k) => {
            const isEdge = k === 0 || k === pts.length - 1;
            const rr = isHl ? 5.5 : (isEdge ? 4.4 : 3.4);
            svg += '<circle class="bump-dot" cx="' + pt.x + '" cy="' + pt.y + '" r="' + rr +
                '" fill="' + col + '" stroke="var(--card)" stroke-width="1.6" opacity="' + op + '" onclick="toggleChartHighlight(' + arg + ')">' +
                '<title>' + esc(p.name) + ' · W' + season[pt.wi].week + ' · rank ' + pt.r + ' · ' + round2(pt.cp) + ' pts</title></circle>';
        });

        // End label as a coloured pill (medal for the overall top three).
        const last = pts[pts.length - 1];
        const tag = (idx < 3 ? medal[idx] + ' ' : '') + p.name;
        const pillW = Math.round(tag.length * 6.6 + (idx < 3 ? 20 : 16));
        const pillH = 20, px = last.x + 11, py = last.y - pillH / 2;
        const pillFill = colored(idx) ? col : '#6b7280';
        svg += '<g opacity="' + (dim ? 0.3 : 1) + '" onclick="toggleChartHighlight(' + arg + ')" style="cursor:pointer">' +
            '<rect x="' + px + '" y="' + py + '" width="' + pillW + '" height="' + pillH + '" rx="10" fill="' + pillFill + '"' +
            (isHl ? ' filter="url(#bumpSh)"' : '') + '/>' +
            '<text class="bump-pill-txt" x="' + (px + pillW / 2) + '" y="' + (last.y + 4) + '" text-anchor="middle">' + esc(tag) + '</text></g>';
    });
    svg += '</svg>';

    return '<div class="lb-sort">Lower line = higher rank. Tap a player to spotlight their run; tap again to reset.</div>' +
        '<div class="chart-wrap">' + svg + '</div>' +
        '<div class="hint">Standing after each week by total points so far. A line begins the week a player first plays' +
        (names.length > 8 ? '; players outside the top 8 are shown in grey' : '') + '.</div>';
}

// Cumulative badge tallies after each week, and the Net they imply.
function netByWeek(season, names) {
    const k = {}, j = {}, c = {}, seen = {}; names.forEach(n => { k[n] = 0; j[n] = 0; c[n] = 0; });
    return season.map(w => {
        weekPlayers(w).forEach(p => { if (k[p] !== undefined) seen[p] = true; });
        const t1 = (w.players && w.players.team1) || [], t2 = (w.players && w.players.team2) || [];
        (w.koRounds || []).forEach(r => {
            const kings = r.winner === 'team1' ? t1 : t2;
            const losers = r.winner === 'team1' ? t2 : t1;
            kings.forEach(p => { if (k[p] !== undefined) k[p]++; });
            losers.forEach(p => { if (j[p] !== undefined) j[p]++; });
            (r.crossed || []).forEach(p => { if (c[p] !== undefined) c[p]++; });
        });
        const net = {}; names.forEach(n => { net[n] = k[n] - (j[n] - c[n]); });
        return { net: net, k: Object.assign({}, k), j: Object.assign({}, j), c: Object.assign({}, c), seen: Object.assign({}, seen) };
    });
}
function niceIntStep(range, count) {
    const raw = Math.max(range, 1) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    const s = n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10;
    return Math.max(1, Math.round(s * mag));
}
function netChartHtml(season, leaderboard) {
    const names = leaderboard.map(p => p.name);
    if (season.length < 1 || names.length < 2) {
        return '<div class="hint" style="margin-top:8px;">Need at least two players and one recorded week to chart Net.</div>';
    }
    const series = netByWeek(season, names);
    let minV = 0, maxV = 0;
    series.forEach(wk => names.forEach(n => { if (wk.seen[n]) { minV = Math.min(minV, wk.net[n]); maxV = Math.max(maxV, wk.net[n]); } }));
    if (minV === 0 && maxV === 0) {
        return '<div class="hint" style="margin-top:8px;">No King Maker / Joker rounds recorded yet &mdash; the Net trend appears once you log some 12-0 rounds.</div>';
    }
    const PAL = ['#2a78d6', '#1baf7a', '#eda100', '#008300', '#4a3aa7', '#e34948', '#e87ba4', '#eb6834'];
    const colored = idx => idx < PAL.length;
    const colorFor = idx => colored(idx) ? PAL[idx] : '#c2c6cc';
    const hl = state.lbHighlight;

    const step = niceIntStep(Math.max(0, maxV) - Math.min(0, minV), 4);
    let hi = Math.ceil(Math.max(0, maxV) / step) * step, lo = Math.floor(Math.min(0, minV) / step) * step;
    if (hi === lo) { hi += step; lo -= step; }

    const topM = 26, plotH = Math.max(150, Math.min(260, ((hi - lo) / step) * 40)), botM = 40, leftM = 38;
    const maxNameLen = names.reduce((m, n) => Math.max(m, n.length), 0);
    const rightM = Math.min(200, Math.max(96, maxNameLen * 7.0 + 58));
    const xStep = Math.max(64, Math.min(122, season.length > 1 ? 430 / (season.length - 1) : 430));
    const X = wi => leftM + wi * xStep;
    const Y = v => topM + (hi - v) / (hi - lo) * plotH;
    const W = Math.round(leftM + (season.length - 1) * xStep + rightM);
    const H = topM + plotH + botM;
    const plotX0 = leftM - 12, plotX1 = X(season.length - 1) + 12;
    const y0 = Y(0);

    let svg = '<svg class="bump-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Net by week">';
    svg += '<defs><filter id="netSh" x="-20%" y="-25%" width="140%" height="150%">' +
        '<feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#0b1220" flood-opacity="0.22"/></filter></defs>';
    // Plot surface + positive(green)/negative(red) bands around the zero line.
    svg += '<rect class="bump-plot" x="' + plotX0 + '" y="' + (topM - 6) + '" width="' + (plotX1 - plotX0) + '" height="' + (plotH + 12) + '" rx="12"/>';
    svg += '<rect x="' + plotX0 + '" y="' + Y(hi) + '" width="' + (plotX1 - plotX0) + '" height="' + Math.max(0, y0 - Y(hi)) + '" fill="#27ae60" opacity="0.06"/>';
    svg += '<rect x="' + plotX0 + '" y="' + y0 + '" width="' + (plotX1 - plotX0) + '" height="' + Math.max(0, Y(lo) - y0) + '" fill="#e74c3c" opacity="0.06"/>';
    // Value gridlines + labels (zero line drawn bold).
    for (let v = lo; v <= hi; v += step) {
        const y = Y(v);
        if (v === 0) svg += '<line x1="' + plotX0 + '" y1="' + y + '" x2="' + plotX1 + '" y2="' + y + '" stroke="var(--muted)" stroke-width="1.4"/>';
        else svg += '<line class="bump-grid" x1="' + plotX0 + '" y1="' + y + '" x2="' + plotX1 + '" y2="' + y + '"/>';
        svg += '<text class="bump-rank" x="' + (leftM - 12) + '" y="' + (y + 4) + '" text-anchor="end">' + (v > 0 ? '+' + v : v) + '</text>';
    }
    season.forEach((w, wi) => {
        const x = X(wi);
        svg += '<line class="bump-vgrid" x1="' + x + '" y1="' + (topM - 6) + '" x2="' + x + '" y2="' + (topM + plotH + 6) + '"/>';
        svg += '<text class="bump-wk" x="' + x + '" y="' + (H - 20) + '" text-anchor="middle">W' + w.week + '</text>';
        const md = (w.date || '').slice(5).replace('-', '/');
        if (md) svg += '<text class="bump-date" x="' + x + '" y="' + (H - 7) + '" text-anchor="middle">' + md + '</text>';
    });

    const order = leaderboard.map((p, idx) => ({ p: p, idx: idx })).sort((a, b) => (hl === a.p.name ? 1 : 0) - (hl === b.p.name ? 1 : 0));
    order.forEach(({ p, idx }) => {
        const pts = [];
        series.forEach((wk, wi) => {
            if (wk.seen[p.name]) pts.push({ x: X(wi), y: Y(wk.net[p.name]), v: wk.net[p.name], wi: wi, k: wk.k[p.name], j: wk.j[p.name], c: wk.c[p.name] });
        });
        if (!pts.length) return;
        const col = colorFor(idx);
        const isHl = hl === p.name;
        const dim = hl && !isHl;
        const op = dim ? 0.14 : 1;
        const sw = isHl ? 4 : (colored(idx) ? 2.6 : 1.8);
        const arg = "'" + esc(p.name).replace(/'/g, "\\'") + "'";
        if (pts.length > 1) {
            svg += '<path class="bump-path" d="' + smoothPath(pts, topM - 4, topM + plotH + 4) + '" stroke="' + col +
                '" stroke-width="' + sw + '" opacity="' + op + '"' + (isHl ? ' filter="url(#netSh)"' : '') +
                ' onclick="toggleChartHighlight(' + arg + ')"/>';
        }
        pts.forEach((pt, kk) => {
            const isEdge = kk === 0 || kk === pts.length - 1;
            const rr = isHl ? 5.5 : (isEdge ? 4.4 : 3.4);
            const sv = pt.v > 0 ? '+' + pt.v : pt.v;
            svg += '<circle class="bump-dot" cx="' + pt.x + '" cy="' + pt.y + '" r="' + rr +
                '" fill="' + col + '" stroke="var(--card)" stroke-width="1.6" opacity="' + op + '" onclick="toggleChartHighlight(' + arg + ')">' +
                '<title>' + esc(p.name) + ' · W' + season[pt.wi].week + ' · King Maker ' + pt.k + ', Jokers ' + pt.j + ', lifted ' + pt.c + ' → Net ' + sv + '</title></circle>';
        });
        const last = pts[pts.length - 1];
        const sv = last.v > 0 ? '+' + last.v : String(last.v);
        const tag = p.name + '  ' + sv;
        const pillW = Math.round(tag.length * 6.6 + 16), pillH = 20, px = last.x + 11, py = last.y - pillH / 2;
        const pillFill = colored(idx) ? col : '#6b7280';
        svg += '<g opacity="' + (dim ? 0.3 : 1) + '" onclick="toggleChartHighlight(' + arg + ')" style="cursor:pointer">' +
            '<rect x="' + px + '" y="' + py + '" width="' + pillW + '" height="' + pillH + '" rx="10" fill="' + pillFill + '"' +
            (isHl ? ' filter="url(#netSh)"' : '') + '/>' +
            '<text class="bump-pill-txt" x="' + (px + pillW / 2) + '" y="' + (last.y + 4) + '" text-anchor="middle">' + esc(tag) + '</text></g>';
    });
    svg += '</svg>';

    return '<div class="lb-sort">Above the zero line = net positive (more King Maker); below = net negative. Tap a player to spotlight.</div>' +
        '<div class="chart-wrap">' + svg + '</div>' +
        '<div class="hint">Running <strong>Net = King Maker &minus; (Jokers &minus; lifted)</strong> after each week. Tap a dot for that week\'s badge breakdown' +
        (names.length > 8 ? '; players outside the top 8 are shown in grey' : '') + '.</div>';
}

/* Top three by season points, shown on a gold/silver/bronze plinth.
   Rendered 2nd–1st–3rd so the leader stands in the middle. */
function podiumHtml(byPoints) {
    const top = byPoints.slice(0, 3);
    if (!top.length) return '';
    const order = top.length >= 3 ? [top[1], top[0], top[2]]
                : top.length === 2 ? [top[1], top[0]]
                : [top[0]];
    const place = p => byPoints.indexOf(p) + 1;
    const crowns = { 1: '👑', 2: '🥈', 3: '🥉' };
    const cells = order.map(p => {
        const n = place(p);
        return '<div class="pod p' + n + '">' +
            '<div class="crown">' + crowns[n] + '</div>' +
            avatarHtml(p.name, n === 1 ? 'lg' : '') +
            '<div class="pname" title="' + esc(p.name) + '">' + esc(p.name) + '</div>' +
            '<div class="ppts" style="color:' + (p.points >= 0 ? 'var(--green)' : 'var(--red)') + '">' + round2(p.points) + '</div>' +
            '<div class="psub">' + p.ppgw.toFixed(1) + ' / week</div>' +
            '<div class="plinth">' + n + '</div>' +
            '</div>';
    }).join('');
    const lead = byPoints[0];
    return '<div class="podium">' +
        '<div class="podium-title">🏆 Season leaders</div>' +
        '<div class="podium-row">' + cells + '</div>' +
        '<div class="hint" style="text-align:center;margin-top:12px;">' +
        esc(lead.name) + ' leads with ' + round2(lead.points) + ' pts · ' +
        lead.roundWins + ' round wins · ' + lead.weeks + ' weeks played</div>' +
        '</div>';
}

function renderSeasonTab() {
    const season = state.data.season;
    let html = pastFormHtml();

    if (season.length === 0) {
        html += '<div class="card"><div class="empty"><div class="big">&#127942;</div>' +
            '<strong style="display:block;color:var(--text);font-size:15px;margin-bottom:4px;">No game days yet</strong>' +
            'Add your first game day above and the leaderboard, charts and season stats will appear here.</div></div>';
    } else {
        // Per-player aggregates
        const stats = {};
        function stat(p) {
            if (!stats[p]) stats[p] = { points: 0, roundWins: 0, weeks: 0, tallied: false, kings: 0, jokers: 0, crossed: 0 };
            return stats[p];
        }
        season.forEach(w => {
            const t1 = (w.players && w.players.team1) || [];
            const t2 = (w.players && w.players.team2) || [];
            const ko = w.koRounds || [];
            weekPlayers(w).forEach(p => stat(p).weeks++);
            // Round wins: for a manually-entered week the recorded 12-0 rounds are
            // its rounds (each is a win for its team); otherwise use the round log.
            if (w.manual && ko.length) {
                ko.forEach(r => (r.winner === 'team1' ? t1 : t2).forEach(p => stat(p).roundWins++));
            } else {
                (w.rounds || []).forEach(r => r.winnerPlayers.forEach(p => stat(p).roundWins++));
            }
            if (w.finalTally) Object.entries(w.finalTally).forEach(([p, v]) => { stat(p).points += v; stat(p).tallied = true; });
            // King Maker / Joker badges from 12-0 rounds.
            ko.forEach(r => {
                const kings = r.winner === 'team1' ? t1 : t2;
                const losers = r.winner === 'team1' ? t2 : t1;
                kings.forEach(p => { stat(p).kings++; });
                losers.forEach(p => { stat(p).jokers++; });
                (r.crossed || []).forEach(p => { stat(p).crossed++; });
            });
        });

        const ppgw = p => p.weeks ? p.points / p.weeks : 0;
        // Net = King Maker - (Jokers received - Jokers lifted).
        const netOf = p => (p.kings || 0) - ((p.jokers || 0) - (p.crossed || 0));
        // Sortable leaderboard columns. Every column falls back to the default
        // tie-break chain: Points -> King Maker -> PPGW, then name.
        const lbVal = {
            points: p => p.points,
            kings: p => p.kings || 0,
            jokers: p => p.jokers || 0,
            crossed: p => p.crossed || 0,
            net: p => netOf(p),
            ppgw: p => p.ppgw
        };
        const sortBy = lbVal[state.lbSort] ? state.lbSort : 'points';
        const tieChain = ['points', 'kings', 'ppgw'];
        const sortKeys = [sortBy, ...tieChain.filter(k => k !== sortBy)];
        const leaderboard = Object.entries(stats)
            .map(([name, s]) => ({ name, ...s, ppgw: (s.weeks ? s.points / s.weeks : 0) }))
            .sort((a, b) => {
                for (const k of sortKeys) { const d = lbVal[k](b) - lbVal[k](a); if (d) return d; }
                return a.name.localeCompare(b.name);
            });

        if (leaderboard.length) {
            // The podium always ranks by points, whatever column the table is sorted on.
            const byPoints = leaderboard.slice().sort((a, b) =>
                (b.points - a.points) || ((b.kings || 0) - (a.kings || 0)) || (b.ppgw - a.ppgw) || a.name.localeCompare(b.name));
            html += podiumHtml(byPoints);

            const view = ['weekly', 'chart', 'net'].includes(state.lbView) ? state.lbView : 'ranking';
            // Clickable, sortable header cell. Active column shows a caret.
            const caret = ' <span class="sort-caret">▾</span>';
            const th = (label, key, title) => '<th class="sortable ' + (sortBy === key ? 'sorted' : '') + '"' +
                (title ? ' title="' + title + '"' : '') + ' onclick="setLbSort(\'' + key + '\')">' +
                label + (sortBy === key ? caret : '') + '</th>';

            // Ranking table
            const rankingHtml =
                '<div class="lb-sort">Tap a column heading to sort.</div>' +
                '<div class="lb-table-wrap"><table class="lb-table"><thead><tr>' +
                '<th class="col-name">Player</th>' +
                th(ICON_KING.replace('ic ic-king', 'ic ic-sm ic-king'), 'kings', 'King Maker') +
                th(ICON_JOKER.replace('ic ic-joker', 'ic ic-sm ic-joker'), 'jokers', 'Jokers received') +
                th(iconCrossed(true), 'crossed', 'Jokers lifted') +
                th('Net', 'net', 'King Maker − (Jokers − lifted)') +
                th('PPGW', 'ppgw') + th('Pts', 'points') +
                '</tr></thead><tbody>' +
                leaderboard.map((p, i) =>
                    '<tr>' +
                    '<td class="col-name"><div class="name-cell">' +
                    '<span class="lb-rank ' + (i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '') + '">' + (i + 1) + '</span>' +
                    avatarHtml(p.name, 'sm') +
                    '<span class="nm"><span class="nt"><span>' + esc(p.name) + '</span>' + guestTag(p.name) + '</span>' +
                    '<span class="lb-sub">' + p.roundWins + ' wins \u00b7 ' + p.weeks + ' wks</span></span>' +
                    '</div></td>' +
                    '<td class="' + (sortBy === 'kings' ? 'sorted' : '') + '">' + (p.kings || 0) + '</td>' +
                    '<td class="' + (sortBy === 'jokers' ? 'sorted' : '') + '">' + (p.jokers || 0) + '</td>' +
                    '<td class="' + (sortBy === 'crossed' ? 'sorted' : '') + '">' + (p.crossed || 0) + '</td>' +
                    '<td class="' + (sortBy === 'net' ? 'sorted' : '') + '" style="color:' + (netOf(p) >= 0 ? 'var(--green)' : 'var(--red)') + '">' + netOf(p) + '</td>' +
                    '<td class="' + (sortBy === 'ppgw' ? 'sorted' : '') + '">' + p.ppgw.toFixed(1) + '</td>' +
                    '<td class="lb-pts-cell ' + (sortBy === 'points' ? 'sorted' : '') + '" style="color:' + (p.points >= 0 ? 'var(--green)' : 'var(--red)') + '">' + round2(p.points) + '</td>' +
                    '</tr>').join('') +
                '</tbody></table></div>' +
                '<div class="hint">' + ICON_KING.replace('ic ic-king', 'ic ic-sm ic-king') + ' King Maker \u00b7 ' + ICON_JOKER.replace('ic ic-joker', 'ic ic-sm ic-joker') + ' Jokers \u00b7 ' + iconCrossed(true) + ' lifted Joker \u00b7 PPGW = points \u00f7 weeks played. Points = tally (badges are counted but add no points).</div>';

            // Weekly breakdown: "points won" (badges add no points).
            const cellFor = (w, p) => {
                if (!weekPlayers(w).includes(p)) return null;
                const base = (w.finalTally && w.finalTally[p] !== undefined) ? w.finalTally[p] : 0;
                return { base };
            };
            const weeklyHtml =
                '<div class="lb-table-wrap"><table class="lb-table wk-table"><thead><tr>' +
                '<th class="col-name">Player</th>' +
                season.map(w => '<th title="' + esc(w.date) + (w.manual ? ' (manual)' : '') + '">W' + w.week + '</th>').join('') +
                '<th>Total</th></tr></thead><tbody>' +
                leaderboard.map(pl => {
                    let total = 0;
                    const cells = season.map(w => {
                        const c = cellFor(w, pl.name);
                        if (!c) return '<td class="wk-empty">\u2013</td>';
                        total += c.base;
                        const col = c.base > 0 ? 'var(--green)' : c.base < 0 ? 'var(--red)' : 'var(--muted)';
                        return '<td style="color:' + col + ';font-weight:700">' + round2(c.base) + '</td>';
                    }).join('');
                    return '<tr><td class="col-name"><div class="name-cell">' + avatarHtml(pl.name, 'sm') +
                        '<span class="nm"><span class="nt"><span>' + esc(pl.name) + '</span>' + guestTag(pl.name) + '</span></span></div></td>' +
                        cells + '<td class="lb-pts-cell" style="color:' + (total >= 0 ? 'var(--green)' : 'var(--red)') + '">' + round2(total) + '</td></tr>';
                }).join('') +
                '</tbody></table></div>' +
                '<div class="hint">Each cell is that week\'s points won. \u2013 = didn\'t play.</div>';

            html += '<div class="card"><h3>Player leaderboard</h3>' +
                '<div class="lb-view">' +
                '<button class="' + (view === 'ranking' ? 'on' : '') + '" onclick="setLbView(\'ranking\')">Ranking</button>' +
                '<button class="' + (view === 'weekly' ? 'on' : '') + '" onclick="setLbView(\'weekly\')">Weekly breakdown</button>' +
                '<button class="' + (view === 'chart' ? 'on' : '') + '" onclick="setLbView(\'chart\')">&#128200; Position chart</button>' +
                '<button class="' + (view === 'net' ? 'on' : '') + '" onclick="setLbView(\'net\')">&#128202; Net trend</button>' +
                '</div>' +
                (view === 'ranking' ? rankingHtml : view === 'weekly' ? weeklyHtml :
                    view === 'chart' ? bumpChartHtml(season, leaderboard) : netChartHtml(season, leaderboard)) +
                '</div>';
        }

        const koTotal = season.reduce((n, w) => n + ((w.koRounds || []).length), 0);
        const roundsTotal = leaderboard.reduce((n, p) => n + p.roundWins, 0);
        const lastDate = season.length ? season[season.length - 1].date : '';
        const tile = (v, l, cls) => '<div class="stat-tile ' + cls + '"><div class="sv">' + v + '</div><div class="sl">' + l + '</div></div>';
        html += '<div class="card"><h3>Season stats</h3>' +
            '<div class="stat-grid">' +
            tile(season.length, 'Game days', 'blue') +
            tile(leaderboard.length, 'Players', 'green') +
            tile(roundsTotal, 'Round wins', 'amber') +
            tile(koTotal, '12-0 rounds', 'violet') +
            '</div>' +
            (lastDate ? '<div class="hint" style="text-align:center;">Last game day &middot; ' + esc(lastDate) + '</div>' : '') +
            '</div>';

        for (let i = season.length - 1; i >= 0; i--) {
            const w = season[i];
            const rounds = w.rounds || [];
            const t1r = rounds.filter(r => r.winner === 'team1').length;
            const t2r = rounds.filter(r => r.winner === 'team2').length;
            const players = w.players || { team1: [], team2: [] };
            const t1names = playerChips(players.team1);
            const t2names = playerChips(players.team2);
            const s1 = w.manual ? w.teamScores.team1 : t1r;
            const s2 = w.manual ? w.teamScores.team2 : t2r;
            const caption = w.manual ? 'Final score' : 'Rounds won';
            const footer = w.manual
                ? 'Entered manually' + (w.finalTally ? ' \u00b7 points recorded &#10003;' : '')
                : w.games.length + ' games' + (w.finalTally ? ' \u00b7 tally saved &#10003;' : ' \u00b7 tally pending');

            const ko = w.koRounds || [];
            let koLine = '';
            if (ko.length) {
                const lines = ko.map((r, ri) => {
                    const kingTeam = r.winner === 'team1' ? 'Team 1' : 'Team 2';
                    const kingCls = r.winner === 'team1' ? 'ko-t1' : 'ko-t2';
                    const lifted = (r.crossed || []).length
                        ? '<span class="ko-lift">' + iconCrossed(true) + ' ' + r.crossed.map(esc).join(', ') + '</span>'
                        : '';
                    return '<div class="ko-line"><span class="ko-rn">Round ' + (ri + 1) + '</span>' +
                        ICON_KING.replace('ic ic-king', 'ic ic-sm ic-king') +
                        '<span class="' + kingCls + '">' + kingTeam + '</span>' + lifted + '</div>';
                }).join('');
                koLine = '<div class="ko-summary"><div class="ko-summary-title">' + ko.length + '× 12-0 rounds</div>' + lines + '</div>';
            }

            const editing = state.editWeek === i;
            html += '<div class="card">' +
                '<div class="week-head">' +
                '<span class="wk-no"><span class="wk-chip">W' + w.week + '</span>' +
                '<span class="wk-date">' + esc(w.date) + '</span>' +
                (w.manual ? '<span class="badge manual">manual</span>' : '') + '</span>' +
                '<span class="wk-right">' +
                (editing ? '' : '<button class="btn small subtle" onclick="editWeekOpen(' + i + ')">✎ Edit points</button>') +
                '</span></div>' +
                '<div class="matchup">' +
                '<div class="team t1' + (s1 > s2 ? ' win' : '') + '"><div class="tlabel">Team 1</div>' +
                '<div class="tscore" style="color:var(--blue)">' + s1 + '</div>' +
                '<div class="tplayers">' + t1names + '</div></div>' +
                '<div class="vs">vs</div>' +
                '<div class="team t2' + (s2 > s1 ? ' win' : '') + '"><div class="tlabel">Team 2</div>' +
                '<div class="tscore" style="color:var(--red)">' + s2 + '</div>' +
                '<div class="tplayers">' + t2names + '</div></div>' +
                '</div>' +
                '<div class="score-caption">' + caption + '</div>' +
                '<div class="meta" style="text-align:center;margin-top:8px;">' + footer + '</div>' +
                koLine +
                (editing ? weekEditHtml(w) : '') +
                '</div>';
        }
    }
    document.getElementById('tab-season').innerHTML = html;
}

function weekEditHtml(w) {
    const isManual = w.manual;
    const teamScoreRow = isManual
        ? '<div class="row">' +
          '<div><label>Team 1 score</label><input type="number" step="any" value="' + esc(state.editBuf.score1) + '" oninput="setEditScore(1, this.value)"></div>' +
          '<div><label>Team 2 score</label><input type="number" step="any" value="' + esc(state.editBuf.score2) + '" oninput="setEditScore(2, this.value)"></div>' +
          '</div>' +
          '<div class="hint" style="margin:8px 0;">Team score applies to everyone on the team. Fill a player box only to override that player.</div>'
        : '<div class="hint" style="margin:8px 0;">Edit each player\'s points for this week.</div>';
    const rows = weekPlayers(w).map(p => {
        const arg = jsArg(p);
        const ph = isManual ? 'team' : '0';
        return '<div class="tally-row">' + avatarHtml(p, 'sm') + '<span class="tname">' + esc(p) + '</span>' +
            '<input type="number" step="any" placeholder="' + ph + '" value="' + esc(state.editBuf.points[p] || '') + '" oninput="setEditPoints(' + arg + ', this.value)"></div>';
    }).join('');
    return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">' +
        '<label>Edit points for Week ' + w.week + '</label>' +
        teamScoreRow + rows +
        koEditorHtml('edit', w.players.team1 || [], w.players.team2 || []) +
        '<div class="row" style="margin-top:10px;">' +
        '<button class="btn subtle" onclick="editWeekCancel()">Cancel</button>' +
        '<button class="btn blue" onclick="editWeekSave()">Save changes</button>' +
        '</div></div>';
}

function renderDataTab() {
    const weeks = (state.data.season || []).length;
    const players = (state.data.roster || []).length;
    const bytes = JSON.stringify(state.data).length;
    const size = bytes > 1024 ? (bytes / 1024).toFixed(1) + ' KB' : bytes + ' B';
    const tile = (v, l, cls) => '<div class="stat-tile ' + cls + '"><div class="sv">' + v + '</div><div class="sl">' + l + '</div></div>';

    document.getElementById('tab-data').innerHTML =
        '<div class="card"><h3>Stored data</h3>' +
        '<div class="stat-grid">' +
        tile(weeks, 'Game days', 'blue') +
        tile(players, 'Roster', 'green') +
        tile(size, 'Size', 'amber') +
        tile(getToken() ? '✓' : '—', 'Signed in', 'violet') +
        '</div></div>' +
        '<div class="card"><h3>Backup and restore</h3>' +
        '<div class="row">' +
        '<button class="btn green" onclick="exportData()">&#8595; Export JSON</button>' +
        '<button class="btn blue" onclick="document.getElementById(\'import-file\').click()">&#8593; Import JSON</button>' +
        '</div>' +
        '<input id="import-file" type="file" accept=".json" onchange="importData(event)" style="display:none;">' +
        '<div class="hint">When signed in and online, every change is saved to Vercel Blob storage (shared across all devices). Export a JSON copy any time for an extra backup.</div></div>' +
        '<div class="card"><h3>Raw data</h3>' +
        '<textarea readonly>' + esc(JSON.stringify(state.data, null, 2)) + '</textarea>' +
        '<button class="btn subtle" style="margin-top:10px;" onclick="copyJson()">Copy to clipboard</button></div>' +
        '<div class="card"><h3>Account</h3>' +
        '<button class="btn danger" onclick="logout()">Sign out</button></div>';
}

function render() {
    if (state.activeTab === 'season') renderSeasonTab();
    if (state.activeTab === 'teams') renderTeamsTab();
    if (state.activeTab === 'roster') renderRosterTab();
    if (state.activeTab === 'data') renderDataTab();
}

applyTheme();
localLoad();
render();
serverLoad();
</script>
</body>
</html>
